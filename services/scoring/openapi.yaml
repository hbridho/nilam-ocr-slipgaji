openapi: 3.1.0
info:
  title: OCR Slip Gaji Scoring API
  description: 'Tahap terakhir pipeline slip gaji: memberi **skor keyakinan per field** — P(nilai ini
    benar), 0-1, terkalibrasi isotonic.


    Modelnya regresi logistik 9 variabel + one-hot field, dilatih pada 1.428 nilai dari 50 dokumen berlabel;
    out-of-fold AUC 0,826 · Gini 0,652 · ECE 0,037. Pada ambang 80: precision 93,4%, recall 75,6%.


    **Tidak ada keputusan di sini.** Skor mentah yang dikembalikan; pemetaan ke `confidence` 0/1 terjadi
    di kontrak `extract-ocr`, supaya ambangnya bisa diubah tanpa melatih ulang apa pun.


    **Pipeline asinkron:** service structuring POST /v1/scoring/jobs dan menerima 202; service ini memberi
    skor di latar, menyimpan hasilnya, dan mengirim callback berisi hasil akhir ke orchestrator. /v1/scoring-direct
    menjalankan model yang sama secara sinkron atas hasil structuring, untuk menguji tahap ini saja (QC);
    tidak ada yang dicatat. Semua endpoint kecuali /health memerlukan header X-API-Key.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `INTERNAL_SERVER_ERROR` (500),

    `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless an endpoint documents a more precise
    one.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator SLIP_GAJI and the previous stage call them).
    `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator SLIP_GAJI''s `GET /v1/extract-ocr/{request_id}`
    combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://ms-bribrain-nilam-ocr-slipgaji-scoring.{namespace}.svc.cluster.local:8033
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: ms-bribrain-nilam-ocr-slipgaji
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-slipgaji)'
- url: http://scoring:8033
  description: The Docker Compose network
- url: http://127.0.0.1:8033
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check, including the database
      description: 'Says whether the service can reach what it depends on: 200 `healthy` when every dependency
        it checks answers (the database, for a service that has one), 503 `unhealthy` with the cause in
        `detail` otherwise. Each check gives up after 3 s. Also lists the active implementations (`backends`).
        Not used by the Kubernetes probes: liveness and startup check the port, readiness is `/ready`.
        Does not require an API key.'
      operationId: getHealth
      responses:
        '200':
          description: Every dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      scoring: conf_v2
                      storage: postgres
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                version: 1.0.0
                detail: database unreachable
                device: cpu
                backends:
                  scoring: conf_v2
                  storage: postgres
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'The readiness probe. Liveness is checked on the port, never on a dependency (a database
        blip must not make Kubernetes restart every pod). /ready says whether this pod can do its job
        right now: 200 when every REQUIRED dependency of this service answers, 503 otherwise, so the pod
        is taken out of the Service until it recovers. Downstream stages and model services are deliberately
        not checked: their outage is reported per job, not by refusing traffic. Does not require an API
        key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      database: ok
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks:
                  database: failed
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/scoring/jobs:
    post:
      tags:
      - Pipeline
      summary: Serahkan dokumen terstruktur ke tahap scoring (terakhir)
      description: '**Langkah 3 pipeline, asinkron, tahap terakhir. Dipanggil service structuring, bukan
        orchestrator.**


        Mencatat job (`scoring_jobs`, idempoten per request_id), menjawab **202 seketika**, lalu di latar:
        memberi skor keyakinan pada setiap field tiap slip, menyimpan hasilnya (`scoring_results`), dan
        mengirim callback `SCORING` yang membawa **hasil akhir** permintaan ini.


        Keluarannya skor 0-1 per field. Tidak ada skor tingkat dokumen dan tidak ada keputusan terima
        / tolak: ambang milik orchestrator.'
      operationId: submitScoringJob
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringJobRequest'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: scoring
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
  /v1/scoring/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Status and result of the scoring stage
      description: 'Status of this stage only and, once `DONE`, the two confidences plus the exact payload
        that was scored. Internal: the orchestrator Slip Gaji reads it (while it waits, and for its `GET
        /v1/extract-ocr/{request_id}`); the central orchestrator receives the final result in the callback.
        Also useful to audit a score.'
      operationId: getScoringJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringJobStatusResponse'
              examples:
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: DONE
                      result:
                        slips:
                        - slip_no: 1
                          scores:
                            nama_karyawan: 0.7671
                            jabatan: 0.7671
                            gaji_pokok: 0.936
                            tunjangan_makan: 0.8889
                            total_pendapatan: 0.9247
                            gaji_bersih: 0.9247
                        threshold: 0.5
                        model: conf_v2
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: Failed
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: SCORING
                      created_at: '2026-09-18T04:00:01+00:00'
                      status: FAILED
                      error_message: 'Unsupported document_type: ktp. Supported: [''slip_gaji'']'
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No scoring job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No SCORING job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring/outbox:
    get:
      tags:
      - Pipeline
      summary: Backlog of this stage's undelivered callbacks and hand-offs
      description: 'Operational view of the transactional outbox (`PIPELINE_OUTBOX`): how many callbacks
        and hand-offs of this stage are still to be delivered, how old the oldest one is, and how many
        were given up on (dead letters). No other service watches the `nilam_pipeline_outbox` table, so
        this is where a monitor should look; the relay also logs a warning when the backlog is older than
        `PIPELINE_OUTBOX_STALE_AFTER_SECONDS` or a dead letter is waiting.'
      operationId: getScoringOutboxStatus
      responses:
        '200':
          description: The backlog of this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxStatusResponse'
              examples:
                idle:
                  summary: Nothing waiting
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: SCORING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                backlog:
                  summary: The orchestrator has been down for a while
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: SCORING
                      pending: 12
                      retrying: 12
                      oldest_pending_seconds: 754.3
                      dead_letters: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                disabled:
                  summary: '`PIPELINE_OUTBOX` is off'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: false
                      stage: SCORING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
  /v1/scoring/outbox/release:
    post:
      tags:
      - Pipeline
      summary: Send this stage's dead letters again
      description: 'Puts the dead letters of this stage back in the outbox queue, due immediately, so
        the relay delivers them again: use it after the receiver was fixed (for example the orchestrator''s
        callback contract, or a next stage that was answering 4xx). Optional query `request_id` limits
        it to one request. A message that fails again goes through the same retry and dead-letter rules.
        `409` when `PIPELINE_OUTBOX` is off on this service.'
      operationId: releaseScoringOutbox
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      responses:
        '200':
          description: Dead letters released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxReleaseResponse'
              examples:
                released:
                  summary: One request
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: SCORING
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      released: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                nothing:
                  summary: Nothing to release
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: SCORING
                      released: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The outbox is off on this service
          content:
            application/json:
              example:
                status_code: 409
                status_desc: Conflict
                message: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                errors: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'query.request_id: Input should be a valid string'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/scoring-direct:
    post:
      tags:
      - Direct
      summary: Beri skor slip terstruktur sekarang, sinkron (tanpa job, tanpa callback)
      description: '**Untuk menguji satu tahap saja (QC).** Menerima keluaran tahap sebelumnya, hasil
        structuring (`data` dari `POST /v1/structuring-direct`, atau `result` job structuring), menjalankan
        model keyakinan, dan menjawab di badan respons. Tidak ada yang dicatat: tidak ada baris `nilam_scoring_jobs`,
        callback, maupun baris hasil Orkestrasi.


        Jawabannya `result` yang sama seperti `GET /v1/scoring/jobs/{request_id}` (P(nilai benar) 0-1
        per field), ditambah `data`: kontrak `extract-ocr` dengan confidence 0/1 menurut `column_confidence_threshold`
        (`all_field` disebar ke semua field; kunci field sendiri menang), lalu `FIELD_CONFIDENCE_THRESHOLD`.
        Field tanpa nilai tidak diberi skor.'
      operationId: scoreDirect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringDirectRequest'
        required: true
      responses:
        '200':
          description: Slip terstruktur sudah dinilai
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringDirectResponse'
              examples:
                satu_slip:
                  summary: Satu slip
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      slips:
                      - slip_no: 1
                        scores:
                          nama_karyawan: 0.7671
                          jabatan: 0.7671
                          gaji_pokok: 0.936
                          tunjangan_makan: 0.8889
                          total_pendapatan: 0.9247
                          gaji_bersih: 0.9247
                      threshold: 0.5
                      model: conf_v2
                      data:
                        total_slip: 1
                        slip:
                        - page: 1
                          gaji_pokok:
                            value: 4500000
                            confidence: 1
                          gaji_bersih:
                            value: 5855000
                            confidence: 1
                          missing_mandatory_fields: []
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Tidak ada slip, atau `document_type` tidak didukung
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: tidak ada slip untuk dinilai
                errors: tidak ada slip untuk dinilai
                pipeline_last_stage: scoring
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: scoring
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.structuring: Field required'
                errors: VALIDATION_ERROR
                pipeline_last_stage: scoring
        '500':
          description: Model keyakinan gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: Internal error in SCORING stage
                errors: Internal error in SCORING stage
                pipeline_last_stage: scoring
      security:
      - APIKeyHeader: []
webhooks:
  stageCallback:
    post:
      tags:
      - Callbacks
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage: SCORING`
        with `status: DONE` and `result` = the **final result** (fields, per-field confidences, and the
        guardrails result that was submitted), or `status: FAILED` with `error_message` and `result: null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with the orchestrator SLIP_GAJI''s `GET /v1/extract-ocr/{request_id}` and should
        time a request out on its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same
        transaction as the result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoringStageCallback'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
