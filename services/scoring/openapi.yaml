          title: Stage
          description: 'Selalu `SCORING`: tahap terakhir'
          default: SCORING
          examples:
          - SCORING
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Hasil tahap ini. `FAILED` di tahap mana pun mengakhiri permintaan
          examples:
          - DONE
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalResult'
          - type: 'null'
          description: Hasil akhir permintaan ketika `status` `DONE`; null ketika `FAILED`
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Kenapa gagal; null bila `status` `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Hanya saat penolakan: `DOWNSTREAM_VALIDATION_ERROR` ketika dokumen ditahan guardrail
            (`error_message` memuat alasannya). Tidak ada ketika sebuah tahap rusak'
          examples:
          - null
      type: object
      required:
      - request_id
      - status
      title: ScoringStageCallback
      description: Isi callback yang dikirim sebuah tahap ke orchestrator saat selesai.
    SlipPayload:
      properties:
        slip_no:
          type: integer
          minimum: 1.0
          title: Slip No
          description: Nomor urut slip dalam dokumen
          examples:
          - 1
        page:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Page
          description: Halaman asal slip ini
          examples:
          - 1
        fields:
          additionalProperties: true
          type: object
          title: Fields
          description: 20 field, selalu lengkap; null bila tidak ditemukan. Nominal uang sudah integer
        source:
          additionalProperties: true
          type: object
          title: Source
          description: 'Asal tiap nilai (`how`: regex | llm | derived, sinonim label, baris OCR) — fitur
            model keyakinan'
        checks:
          additionalProperties: true
          type: object
          title: Checks
          description: Hasil cek aritmetika slip
        counts:
          additionalProperties: true
          type: object
          title: Counts
          description: Berapa field terisi, dan dari lapisan mana
        llm:
          additionalProperties: true
          type: object
          title: Llm
          description: Jejak arbitrase LLM; `compare` dibaca model keyakinan
        ocr_text:
          anyOf:
          - type: string
          - type: 'null'
          title: Ocr Text
          description: Teks halaman asal — fitur mutu OCR di tahap scoring
        ocr_confidence:
          additionalProperties: true
          type: object
          title: Ocr Confidence
          description: Skor OCR halaman asal
        missing_mandatory_fields:
          items:
            type: string
          type: array
          title: Missing Mandatory Fields
          description: Field wajib yang tidak terisi pada slip ini
      additionalProperties: true
      type: object
      required:
      - slip_no
      - fields
      title: SlipPayload
      description: Satu slip gaji hasil structuring.
    SlipScores:
      properties:
        slip_no:
          type: integer
          minimum: 1.0
          title: Slip No
          examples:
          - 1
        scores:
          additionalProperties:
            type: number
          type: object
          title: Scores
          description: '{field: P(nilai ini benar), 0-1}. Hanya field yang ada nilainya yang diberi skor'
          examples:
          - gaji_pokok: 0.936
            total_pendapatan: 0.9247
            tunjangan_makan: 0.8889
      type: object
      required:
      - slip_no
      - scores
      title: SlipScores
    StructuringPayload:
      properties:
        document_type:
          anyOf:
          - type: string
          - type: 'null'
          title: Document Type
          description: Jenis dokumen
          examples:
          - slip_gaji
        n_slips:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Slips
          description: Jumlah slip di dokumen ini
          examples:
          - 3
        slips:
          items:
            $ref: '#/components/schemas/SlipPayload'
          type: array
          title: Slips
          description: Satu entri per slip, urut halaman
        llm_used:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Llm Used
          description: true bila arbitrase LLM benar-benar dipanggil
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: Terisi bila aturan structuring menolak dokumen
      additionalProperties: true
      type: object
      required:
      - slips
      title: StructuringPayload
      description: Hasil tahap structuring (`structuring_results`), diteruskan ke scoring.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Tahap pipeline asinkron: 202, kerja di latar, callback'
- name: Callbacks
  description: Permintaan yang DIKIRIM service ini ke orchestrator (lihat Webhooks)
- name: Direct
  description: 'Tahap ini saja atas keluaran tahap sebelumnya, sinkron: tidak ada yang dicatat (QC)'
- name: Health
  description: Health and readiness checks; no API key
