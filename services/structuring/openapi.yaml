          - type: 'null'
          title: Error Code
          description: 'Hanya saat penolakan: `DOWNSTREAM_VALIDATION_ERROR` ketika dokumen ditahan guardrail
            (`error_message` memuat alasannya). Tidak ada ketika sebuah tahap rusak'
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Isi callback yang dikirim sebuah tahap ke orchestrator saat selesai.
    StructuringDirectRequest:
      properties:
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Diulang di respons; opsional
          examples:
          - QC_1
        document_type:
          type: string
          title: Document Type
          description: Hanya `slip_gaji`
          default: slip_gaji
          examples:
          - slip_gaji
        ocr:
          $ref: '#/components/schemas/OcrPayload'
          description: 'Hasil tahap OCR apa adanya: `data` dari `POST /v1/extraction/extract`, atau `result`
            job OCR. Yang dibaca hanya `pages[]` (teks + ringkasan skor OCR per halaman)'
      type: object
      required:
      - ocr
      title: StructuringDirectRequest
    StructuringDirectResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuringResult'
      type: object
      required:
      - data
      title: StructuringDirectResponse
    StructuringJobRequest:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id dari orchestrator
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          default: slip_gaji
          examples:
          - slip_gaji
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsPayload'
          - type: 'null'
          description: Laporan guardrail dari tahap OCR; diteruskan apa adanya sampai hasil akhir
        ocr:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Ocr
          description: 'Hasil tahap OCR (`pages[]`, `full_text`). Boleh dihilangkan bila `PIPELINE_HANDOFF_BY_REFERENCE`
            menyala: service ini membacanya dari `ocr_results` memakai request_id'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: Urutan service permintaan ini; null = pipeline penuh. Bila `structuring` terakhir,
            job ini mengakhiri permintaan dan tidak diteruskan ke scoring
          examples:
          - null
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: Ambang per field (0-1) dari permintaan; diteruskan ke scoring
          examples:
          - null
      type: object
      required:
      - request_id
      title: StructuringJobRequest
    StructuringJobStatus:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id of the pipeline run
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: STRUCTURING
          title: Stage
          default: STRUCTURING
          examples:
          - STRUCTURING
        status:
          type: string
          enum:
          - PROCESSING
          - DONE
          - FAILED
          title: Status
          description: '`PROCESSING` -> `DONE` | `FAILED`. A `FAILED` job may go back to `PROCESSING`
            when resubmitted'
          examples:
          - DONE
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Why the stage failed; null unless `status` is `FAILED`. Same text as the FAILED
            callback
          examples:
          - null
        created_at:
          type: string
          title: Created At
          description: When the job was first accepted (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:00+00:00'
        updated_at:
          type: string
          title: Updated At
          description: Last status change (ISO 8601, UTC)
          examples:
          - '2026-09-18T04:00:01+00:00'
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'The request''s pipeline_name_sequence (null: the full pipeline). The orchestrator
            reads it from the OCR job to answer `GET /v1/extract-ocr/{request_id}` up to the same last
            service as the POST'
          examples:
          - null
        column_confidence_threshold:
          anyOf:
          - additionalProperties:
              type: number
            type: object
          - type: 'null'
          title: Column Confidence Threshold
          description: 'The central orchestrator''s per-field thresholds (0-1) the job was submitted with
            (an `all_field` it sent is already spread over the 20 slip fields); null when none were given:
            `FIELD_CONFIDENCE_THRESHOLD` for every field'
          examples:
          - gaji_bersih: 0.9
            gaji_pokok: 0.9
        result:
          anyOf:
          - $ref: '#/components/schemas/StructuringResult'
          - type: 'null'
          description: Hasil structuring setelah `status` menjadi `DONE`
      type: object
      required:
      - request_id
      - status
      - created_at
      - updated_at
      title: StructuringJobStatus
    StructuringJobStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/StructuringJobStatus'
      type: object
      required:
      - data
      title: StructuringJobStatusResponse
    StructuringResult:
      properties:
        document_type:
          type: string
          title: Document Type
          examples:
          - slip_gaji
        n_slips:
          type: integer
          minimum: 0.0
          title: N Slips
          description: Jumlah slip yang ditemukan di dokumen ini
          examples:
          - 3
        slips:
          items:
            $ref: '#/components/schemas/SlipOut'
          type: array
          title: Slips
          description: Satu entri per slip, urut halaman
        llm_used:
          type: boolean
          title: Llm Used
          description: true bila arbitrase LLM benar-benar dipanggil
          default: false
        elapsed_ms:
          anyOf:
          - type: number
          - type: 'null'
          title: Elapsed Ms
          description: Waktu structuring, milidetik
          examples:
          - 227.5
        reject_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reject Reason
          description: Terisi bila aturan structuring menolak dokumen; pipeline berhenti dan klien menerima
            400
      type: object
      required:
      - document_type
      - n_slips
      - slips
      title: StructuringResult
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Tahap pipeline asinkron: 202, kerja di latar, callback, penyerahan'
- name: Callbacks
  description: Permintaan yang DIKIRIM service ini ke orchestrator (lihat Webhooks)
- name: Direct
  description: 'Tahap ini saja atas keluaran tahap sebelumnya, sinkron: tidak ada yang dicatat (QC)'
- name: Health
  description: Health and readiness checks; no API key
