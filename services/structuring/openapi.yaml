  /v1/structuring/outbox:
    get:
      tags:
      - Pipeline
      summary: Backlog of this stage's undelivered callbacks and hand-offs
      description: 'Operational view of the transactional outbox (`PIPELINE_OUTBOX`): how many callbacks
        and hand-offs of this stage are still to be delivered, how old the oldest one is, and how many
        were given up on (dead letters). No other service watches the `nilam_pipeline_outbox` table, so
        this is where a monitor should look; the relay also logs a warning when the backlog is older than
        `PIPELINE_OUTBOX_STALE_AFTER_SECONDS` or a dead letter is waiting.'
      operationId: getStructuringOutboxStatus
      responses:
        '200':
          description: The backlog of this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxStatusResponse'
              examples:
                idle:
                  summary: Nothing waiting
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: STRUCTURING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                backlog:
                  summary: The orchestrator has been down for a while
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: STRUCTURING
                      pending: 12
                      retrying: 12
                      oldest_pending_seconds: 754.3
                      dead_letters: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                disabled:
                  summary: '`PIPELINE_OUTBOX` is off'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: false
                      stage: STRUCTURING
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: structuring
      security:
      - APIKeyHeader: []
  /v1/structuring/outbox/release:
    post:
      tags:
      - Pipeline
      summary: Send this stage's dead letters again
      description: 'Puts the dead letters of this stage back in the outbox queue, due immediately, so
        the relay delivers them again: use it after the receiver was fixed (for example the orchestrator''s
        callback contract, or a next stage that was answering 4xx). Optional query `request_id` limits
        it to one request. A message that fails again goes through the same retry and dead-letter rules.
        `409` when `PIPELINE_OUTBOX` is off on this service.'
      operationId: releaseStructuringOutbox
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      responses:
        '200':
          description: Dead letters released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxReleaseResponse'
              examples:
                released:
                  summary: One request
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: STRUCTURING
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      released: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                nothing:
                  summary: Nothing to release
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: STRUCTURING
                      released: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The outbox is off on this service
          content:
            application/json:
              example:
                status_code: 409
                status_desc: Conflict
                message: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                errors: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'query.request_id: Input should be a valid string'
                errors: VALIDATION_ERROR
                pipeline_last_stage: structuring
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/structuring-direct:
    post:
      tags:
      - Direct
      summary: Strukturkan hasil OCR sekarang, sinkron (tanpa job, tanpa callback, tanpa penyerahan)
      description: '**Untuk menguji satu tahap saja (QC).** Menerima keluaran tahap sebelumnya, hasil
        OCR service extraction (`data` dari `POST /v1/extraction/extract`, atau `result` job-nya), menjalankan
        aturan structuring yang sama dengan pipeline, dan menjawab slip gaji terstruktur di badan respons.
        Tidak ada yang dicatat: tidak ada baris `nilam_structuring_jobs`, callback, maupun penyerahan
        ke scoring.


        Jawabannya persis `result` pada `GET /v1/structuring/jobs/{request_id}` dan `structuring` yang
        diterima tahap scoring: tempel ke `POST /v1/scoring-direct` untuk menguji tahap berikutnya.


        **Satu halaman = satu slip.** Dua lapis: aturan (sinonim label, pembacaan kolom, turunan aritmetika)
        dan, bila `ENABLE_LLM` menyala, arbitrase nilai uang lewat LLM. Hasil OCR tanpa satu pun halaman
        berteks: 400.'
      operationId: structureDirect
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StructuringDirectRequest'
        required: true
      responses:
        '200':
          description: Hasil OCR sudah distrukturkan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StructuringDirectResponse'
              examples:
                tiga_slip:
                  summary: Satu berkas berisi tiga bulan
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      document_type: slip_gaji
                      n_slips: 3
                      slips:
                      - slip_no: 1
                        page: 1
                        fields:
                          nama_perusahaan: PT SUMBER REJEKI MAKMUR
                          periode: 2025-02
                          nama_karyawan: ANDI SAPUTRA
                          nomor_induk_karyawan: '202309001'
                          jabatan: Staff Gudang
                          status_pegawai: Tetap
                          gaji_pokok: 4500000
                          tunjangan_jabatan: 500000
                          tunjangan_transport: 300000
                          tunjangan_makan: 600000
                          lembur: 180000
                          total_pendapatan: 6080000
                          total_potongan: 225000
                          gaji_bersih: 5855000
                        source:
                          gaji_pokok:
                            how: regex
