        pending:
          type: integer
          title: Pending
          description: Messages not yet delivered, including the ones a relay is sending right now
          examples:
          - 0
        retrying:
          type: integer
          title: Retrying
          description: 'Of `pending`: messages that already failed at least once'
          examples:
          - 0
        oldest_pending_seconds:
          anyOf:
          - type: number
          - type: 'null'
          title: Oldest Pending Seconds
          description: Age of the oldest pending message; null when nothing is pending. Growing past `PIPELINE_OUTBOX_STALE_AFTER_SECONDS`
            means the orchestrator or the next stage is not taking messages
          examples:
          - null
        dead_letters:
          type: integer
          title: Dead Letters
          description: Messages given up on (a 4xx from the receiver, or 5xx for longer than `PIPELINE_OUTBOX_MAX_AGE_SECONDS`).
            They stay in `nilam_pipeline_outbox` with `failed_at` and `last_error` for inspection and
            are never retried; anything above 0 needs a human
          examples:
          - 0
      type: object
      required:
      - enabled
      - stage
      - pending
      - retrying
      - dead_letters
      title: OutboxStatus
      description: The `data` of `GET /v1/<stage>/outbox`.
    OutboxStatusResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          default: 200
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          default: OK
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Human-readable outcome
          default: Success
          examples:
          - Success
        errors:
          type: 'null'
          title: Errors
          description: Always null on success
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: 'The request_id this response belongs to: the one sent in the form / body / path,
            otherwise the `X-Request-ID` header, otherwise one generated by the service'
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        data:
          $ref: '#/components/schemas/OutboxStatus'
      type: object
      required:
      - data
      title: OutboxStatusResponse
      description: Envelope of `GET /v1/<stage>/outbox`.
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
      description: '`GET /ready`.'
    StageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id yang Anda kirim lewat `POST /v1/ekstraksi/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          enum:
          - OCR
          - STRUCTURING
          - SCORING
          title: Stage
          description: 'Tahap yang statusnya dilaporkan. Biasanya tahap pengirim sendiri; ketika penyerahan
            ke tahap BERIKUTNYA gagal setelah beberapa percobaan, pengirim melaporkan `status: FAILED`
            dengan nama tahap berikutnya, karena tahap itu tidak pernah menerima jobnya dan tidak bisa
            melapor sendiri'
          examples:
          - OCR
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Hasil tahap ini. `FAILED` di tahap mana pun mengakhiri permintaan
          examples:
          - DONE
        result:
          type: 'null'
          title: Result
          description: Selalu null untuk OCR dan STRUCTURING; baca hasilnya lewat GET .../jobs/{request_id}
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Kenapa gagal; null bila `status` `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Hanya saat penolakan: `DOWNSTREAM_VALIDATION_ERROR` ketika dokumen ditahan guardrail
            (`error_message` memuat alasannya). Tidak ada ketika sebuah tahap rusak'
          examples:
          - null
      type: object
      required:
      - request_id
      - stage
      - status
      title: StageCallback
      description: Isi callback yang dikirim sebuah tahap ke orchestrator saat selesai.
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Pipeline
  description: 'Asynchronous pipeline stage: 202, background work, callback, hand-off'
- name: Callbacks
  description: Requests this service SENDS to the orchestrator (see Webhooks)
- name: Extraction
  description: Raw OCR text, synchronous
- name: Health
  description: Health and readiness checks; no API key
