openapi: 3.1.0
info:
  title: OCR Slip Gaji Extraction API
  description: 'OCR stage of the slip gaji pipeline (ms-bribrain-nilam-ocr-slipgaji-extraction). **Async
    pipeline:** the slip gaji orchestrator POSTs /v1/extraction/jobs and gets 202; this service reads
    the document in the background, then (when the sequence includes `guardrails`) calls guardrail-blank,
    guardrail-blur and guardrail-identity at the same time, stores the result, reports to the central
    orchestrator (callback / its tables), and hands the job to the structuring service. The raw OCR step
    is also exposed as /v1/extraction/extract. All endpoints except /health require an X-API-Key header.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `INTERNAL_SERVER_ERROR` (500),

    `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless an endpoint documents a more precise
    one.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator SLIP_GAJI and the previous stage call them).
    `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator SLIP_GAJI''s `GET /v1/extract-ocr/{request_id}`
    combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://ms-bribrain-nilam-ocr-slipgaji-extraction.{namespace}.svc.cluster.local:8030
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: ms-bribrain-nilam-ocr-slipgaji
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-slipgaji)'
- url: http://extraction:8030
  description: The Docker Compose network
- url: http://127.0.0.1:8030
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check, including the database
      description: 'Says whether the service can reach what it depends on: 200 `healthy` when every dependency
        it checks answers (the database, for a service that has one), 503 `unhealthy` with the cause in
        `detail` otherwise. Each check gives up after 3 s. Also lists the active implementations (`backends`).
        Not used by the Kubernetes probes: liveness and startup check the port, readiness is `/ready`.
        Does not require an API key.'
      operationId: getHealth
      responses:
        '200':
          description: Every dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends:
                      extraction: paddle
                      storage: postgres
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                version: 1.0.0
                detail: database unreachable
                device: cpu
                backends:
                  extraction: paddle
                  storage: postgres
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'The readiness probe. Liveness is checked on the port, never on a dependency (a database
        blip must not make Kubernetes restart every pod). /ready says whether this pod can do its job
        right now: 200 when every REQUIRED dependency of this service answers, 503 otherwise, so the pod
        is taken out of the Service until it recovers. Downstream stages and model services are deliberately
        not checked: their outage is reported per job, not by refusing traffic. Does not require an API
        key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks:
                      database: ok
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks:
                  database: failed
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/extraction/jobs:
    post:
      tags:
      - Pipeline
      summary: Mulai pipeline untuk sebuah dokumen (tahap OCR)
      description: '**Langkah 1 pipeline, asinkron: awal rantai OCR -> structuring -> scoring.** Dipanggil
        orchestrator Slip Gaji dari `POST /v1/extract-ocr`; Orkestrasi pusat tidak memanggilnya.


        Mencatat job (`ocr_jobs`, idempoten per request_id), menjawab **202 seketika**, lalu di latar:
        membaca dokumen (`file`, atau mengunduh `file_url`), menjalankan OCR, **meminta guardrail menilai
        teksnya**, menyimpan hasil (`ocr_results`), mengirim callback `OCR`, dan menyerahkan job ke service
        structuring.


        **Guardrail berjalan di sini, bukan sebelum pipeline.** Model guardrail slip gaji membaca teks
        OCR (AUC 0,908) dan bukan piksel (0,638), jadi ia baru bisa menilai setelah tahap ini membaca
        dokumen. Dokumen yang ditahan membuat job ini tetap `DONE` — hasil OCR-nya tersimpan dan bisa
        ditelusuri — tetapi tidak diteruskan ke structuring, dan orchestrator menjawab 400 dengan `guardrails:
        1`.


        **Tiga guardrail, masing-masing bisa mati sendiri.** guardrail-blank, guardrail-blur dan guardrail-identity
        dipanggil bersamaan. Yang dimatikan (`GUARDRAIL_<NAMA>_ENABLED=false`) tercatat di `skipped`;
        yang menyala tetapi tidak menjawab tercatat di `unavailable` selama `GUARDRAILS_FAIL_OPEN` menyala
        (bawaan) — dua yang lain tetap memutuskan. Dimatikan, galat guardrail menjadi job `FAILED`.


        **Dokumen.** Kirim `file` (multipart) atau `file_url`, tepat salah satu. JPEG, PNG atau PDF, paling
        besar `MAX_UPLOAD_BYTES` (2,5 MB bawaan). `file_url` diunduh di latar, jadi buat presigned URL
        berumur lebih panjang daripada antrean terburuk; URL kedaluwarsa menjadi job `FAILED`, bukan `4xx`.


        **Idempotensi.** request_id yang sama menjawab `202` dengan `duplicate: true` dan tidak menjalankan
        OCR dua kali, kecuali percobaan sebelumnya `FAILED` atau sudah `PROCESSING` lebih lama daripada
        sewa job (`PIPELINE_JOB_LEASE_SECONDS`, bawaan 5 menit).'
      operationId: submitOcrJob
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_submitOcrJob'
        required: true
      responses:
        '202':
          description: The job was accepted (or already existed)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JobAcceptedResponse'
              examples:
                accepted:
                  summary: New job
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      status: PROCESSING
                      duplicate: false
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                duplicate:
                  summary: 'Same request_id sent again: nothing is re-run, `status` is the existing job''s
                    status'
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: Accepted
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      status: DONE
                      duplicate: true
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Tidak satu pun atau keduanya dari file / file_url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Tidak ada berkas yang diterima. Lampirkan `file` (unggahan), atau isi `file_url`
                errors: Tidak ada berkas yang diterima. Lampirkan `file` (unggahan), atau isi `file_url`
                pipeline_last_stage: extraction
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: extraction
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.request_id: Field required'
                errors: VALIDATION_ERROR
                pipeline_last_stage: extraction
      security:
      - APIKeyHeader: []
  /v1/extraction/jobs/{request_id}:
    get:
      tags:
      - Pipeline
      summary: Status and result of the OCR stage
      description: 'Status of this stage only, and its raw OCR result once `DONE`. Internal: the orchestrator
        Slip Gaji reads it (while it waits, and for its `GET /v1/extract-ocr/{request_id}`), and it helps
        to debug. The later stages have the same endpoint on their own service (`/v1/structuring/jobs/{request_id}`,
        `/v1/scoring/jobs/{request_id}`).'
      operationId: getOcrJob
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
      responses:
        '200':
          description: The job exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OcrJobStatusResponse'
              examples:
                processing:
                  summary: Still running
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: PROCESSING
                      updated_at: '2026-09-18T04:00:00+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                done:
                  summary: Finished
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: DONE
                      result:
                        engine: rapidocr
                        model: rapidocr
                        elapsed_ms: 2841.7
                        n_pages: 3
                        full_text: 'PT SUMBER REJEKI MAKMUR

                          SLIP GAJI

                          Periode  : Februari 2025

                          Gaji Pokok  Rp 4.500.000

                          ...'
                        pages:
                        - page: 1
                          text: 'PT SUMBER REJEKI MAKMUR

                            SLIP GAJI

                            Periode  : Februari 2025

                            Gaji Pokok  Rp 4.500.000'
                          confidence:
                            engine: rapidocr
                            n_boxes: 84
                            mean: 0.9812
                            min: 0.4123
                            n_low: 4
                        guardrails:
                          passed: true
                          verdict: slip_gaji
                          document:
                            verdict: accepted
                            confidence: 0.9934
                            n_pages: 3
                            threshold: 0.47
                          checks:
                            blank:
                              check: blank
                              verdict: ok
                              passed: true
                              chars: 1789
                              max_chars: 20
                              model: slip_blank
                            blur:
                              check: blur
                              verdict: ok
                              passed: true
                              p_broken: 0.0153
                              threshold: 0.9584
                              chars: 1789
                              ocr_mean: 0.9812
                              blank: false
                              model: slip_blur
                            identity:
                              check: identity
                              verdict: slip_gaji
                              passed: true
                              proba_slip_gaji: 0.9934
                              confidence: 0.9934
                              reject_threshold: 0.47
                              model: slip_identity
                          skipped: []
                          unavailable: []
                          pages: []
                      updated_at: '2026-09-18T04:00:01+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                failed:
                  summary: 'Failed: same `error_message` as the FAILED callback. Resubmitting the request_id
                    runs it again'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      stage: OCR
                      created_at: '2026-09-18T04:00:00+00:00'
                      status: FAILED
                      error_message: extraction OCR model is unavailable
                      updated_at: '2026-09-18T04:00:03+00:00'
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: extraction
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No OCR job for this request_id
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                errors: 'No OCR job found for request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0'
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: extraction
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'path.request_id: Field required'
                errors: VALIDATION_ERROR
                request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: extraction
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/extraction/outbox:
    get:
      tags:
      - Pipeline
      summary: Backlog of this stage's undelivered callbacks and hand-offs
      description: 'Operational view of the transactional outbox (`PIPELINE_OUTBOX`): how many callbacks
        and hand-offs of this stage are still to be delivered, how old the oldest one is, and how many
        were given up on (dead letters). No other service watches the `nilam_pipeline_outbox` table, so
        this is where a monitor should look; the relay also logs a warning when the backlog is older than
        `PIPELINE_OUTBOX_STALE_AFTER_SECONDS` or a dead letter is waiting.'
      operationId: getExtractionOutboxStatus
      responses:
        '200':
          description: The backlog of this stage
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxStatusResponse'
              examples:
                idle:
                  summary: Nothing waiting
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: OCR
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                backlog:
                  summary: The orchestrator has been down for a while
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: true
                      stage: OCR
                      pending: 12
                      retrying: 12
                      oldest_pending_seconds: 754.3
                      dead_letters: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                disabled:
                  summary: '`PIPELINE_OUTBOX` is off'
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      enabled: false
                      stage: OCR
                      pending: 0
                      retrying: 0
                      dead_letters: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: extraction
      security:
      - APIKeyHeader: []
  /v1/extraction/outbox/release:
    post:
      tags:
      - Pipeline
      summary: Send this stage's dead letters again
      description: 'Puts the dead letters of this stage back in the outbox queue, due immediately, so
        the relay delivers them again: use it after the receiver was fixed (for example the orchestrator''s
        callback contract, or a next stage that was answering 4xx). Optional query `request_id` limits
        it to one request. A message that fails again goes through the same retry and dead-letter rules.
        `409` when `PIPELINE_OUTBOX` is off on this service.'
      operationId: releaseOcrOutbox
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
      responses:
        '200':
          description: Dead letters released
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutboxReleaseResponse'
              examples:
                released:
                  summary: One request
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: OCR
                      request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                      released: 1
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
                nothing:
                  summary: Nothing to release
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      stage: OCR
                      released: 0
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: extraction
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: The outbox is off on this service
          content:
            application/json:
              example:
                status_code: 409
                status_desc: Conflict
                message: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                errors: 'PIPELINE_OUTBOX is off: there is no outbox to release'
                pipeline_last_stage: extraction
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'query.request_id: Input should be a valid string'
                errors: VALIDATION_ERROR
                pipeline_last_stage: extraction
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/extraction/extract:
    post:
      tags:
      - Extraction
      summary: OCR mentah satu dokumen, sinkron (tanpa job, tanpa callback)
      description: 'Menjalankan mesin OCR dan mengembalikan teks per halaman beserta ringkasan skor keyakinannya,
        lalu meminta guardrail menilai teks itu.


        **Halaman tidak digabung.** Satu berkas slip gaji lazim memuat tiga bulan berturut-turut; menggabungkan
        teksnya akan mencampur komponen satu bulan ke total bulan lain. `full_text` ada untuk guardrail,
        `pages[]` untuk structuring.


        Kirim dokumen sebagai `file` atau `file_url`, tepat salah satu.'
      operationId: extractText
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractText'
      responses:
        '200':
          description: Teks terbaca
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractResponse'
              examples:
                slip_gaji:
                  summary: Slip gaji 3 bulan
                  value:
                    status_code: 200
                    status_desc: OK
                    message: Success
                    data:
                      engine: rapidocr
                      model: rapidocr
                      elapsed_ms: 2841.7
                      n_pages: 3
                      full_text: 'PT SUMBER REJEKI MAKMUR

                        SLIP GAJI

                        Periode  : Februari 2025

                        Gaji Pokok  Rp 4.500.000

                        ...'
                      pages:
                      - page: 1
                        text: 'PT SUMBER REJEKI MAKMUR

                          SLIP GAJI

                          Periode  : Februari 2025

                          Gaji Pokok  Rp 4.500.000'
                        confidence:
                          engine: rapidocr
                          n_boxes: 84
                          mean: 0.9812
                          min: 0.4123
                          n_low: 4
                      guardrails:
                        passed: true
                        verdict: slip_gaji
                        document:
                          verdict: accepted
                          confidence: 0.9934
                          n_pages: 3
                          threshold: 0.47
                        checks:
                          blank:
                            check: blank
                            verdict: ok
                            passed: true
                            chars: 1789
                            max_chars: 20
                            model: slip_blank
                          blur:
                            check: blur
                            verdict: ok
                            passed: true
                            p_broken: 0.0153
                            threshold: 0.9584
                            chars: 1789
                            ocr_mean: 0.9812
                            blank: false
                            model: slip_blur
                          identity:
                            check: identity
                            verdict: slip_gaji
                            passed: true
                            proba_slip_gaji: 0.9934
                            confidence: 0.9934
                            reject_threshold: 0.47
                            model: slip_identity
                        skipped: []
                        unavailable: []
                        pages: []
                    request_id: REQ_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: Berkas buruk (kosong, jenis tidak didukung, tak terbaca) atau tanpa teks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Uploaded file is empty
                errors: Uploaded file is empty
                pipeline_last_stage: extraction
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: extraction
        '413':
          description: Dokumen melebihi `MAX_UPLOAD_BYTES` (2,5 MB bawaan)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 413
                status_desc: Payload Too Large
                message: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen slip
                  gaji
                errors: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen slip gaji
                pipeline_last_stage: extraction
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'body.file: Expected UploadFile, received: str'
                errors: VALIDATION_ERROR
                pipeline_last_stage: extraction
        '500':
          description: Mesin OCR gagal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: Internal error in OCR stage
                errors: Internal error in OCR stage
                pipeline_last_stage: extraction
        '503':
          description: Sebuah service guardrail tidak terjangkau dan GUARDRAILS_FAIL_OPEN mati
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: guardrail-blur service is unavailable
                errors: guardrail-blur service is unavailable
                pipeline_last_stage: extraction
      security:
      - APIKeyHeader: []
webhooks:
  stageCallback:
    post:
      tags:
      - Callbacks
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per job of `POST /v1/extraction/jobs`: `stage: OCR` with `status: DONE` once the
        OCR result is stored, or `status: FAILED` with `error_message` when the document could not be
        read (the chain stops there). Additionally `stage: STRUCTURING`, `status: FAILED` when OCR succeeded
        but the structuring service could not be reached after retries. Without `PIPELINE_OUTBOX` the
        `OCR` callback is sent before the hand-off to structuring; with it the hand-off goes first, so
        the `STRUCTURING` callback may arrive before this one.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with the orchestrator SLIP_GAJI''s `GET /v1/extract-ocr/{request_id}` and should
        time a request out on its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same
        transaction as the result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageCallback'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_extractText:
      properties:
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
