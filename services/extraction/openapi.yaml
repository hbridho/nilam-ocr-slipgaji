          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
        guardrails:
          type: boolean
          title: Guardrails
          description: '`false` melewati ketiga guardrail untuk permintaan ini'
          default: true
      type: object
      title: Body_extractText
    Body_submitOcrJob:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id yang dibuat orchestrator
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Jenis dokumen pilihan klien. Hanya `slip_gaji` yang didukung
          default: slip_gaji
          examples:
          - slip_gaji
        pipeline_name_sequence:
          anyOf:
          - type: string
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'JSON array, sudah diperiksa orchestrator: `guardrails` -> `extraction` -> `structuring`
            -> `scoring`. Tidak dikirim: keempatnya. Tanpa `guardrails` ketiga guardrail tidak dipanggil;
            berakhir di `guardrails` atau `extraction` membuat job ini mengakhiri permintaan'
          examples:
          - '["guardrails","extraction","structuring","scoring"]'
        guardrails_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Guardrails Confidence Threshold
          description: 'Ambang guardrail permintaan ini (sisi accept), sudah diperiksa dan dinormalkan
            orchestrator: `{"identity": 0.8, "blur": 0.7}`'
        column_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Column Confidence Threshold
          description: 'JSON `{field: 0-1}` (boleh `all_field`); diteruskan ke scoring'
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
      type: object
      required:
      - request_id
      title: Body_submitOcrJob
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
