        '202':
          description: Masih berjalan
          content:
            application/json:
              examples:
                processing:
                  summary: Masih diproses
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '400':
          description: 'Ditahan guardrail atau ditolak aturan structuring (`DOWNSTREAM_VALIDATION_ERROR`,
            `guardrails: 1`)'
          content:
            application/json:
              example:
                status_code: 400
                status_desc: Bad Request
                message: Dokumen ini bukan slip gaji. Mohon unggah slip gaji.
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
                guardrails: 1
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '401':
          description: Missing or invalid X-API-Key
          content:
            application/json:
              example:
                status_code: 401
                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Tidak ada tahap yang punya job untuk request_id ini
          content:
            application/json:
              example:
                status_code: 404
                status_desc: Not Found
                message: No request found for request_id OCR_9cb01af2-493d-446d-b191-af120333f6d0
                errors: REQUEST_ID_NOT_FOUND
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Sebuah tahap gagal (`OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`)
          content:
            application/json:
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: tidak ada teks OCR yang bisa distrukturkan
                errors: STRUCTURING_FAILED
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: structuring
                guardrails: 0
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
        '500':
          description: Sebuah tahap menjawab bentuk tak terduga
          content:
            application/json:
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: 'structuring service error (401): Invalid or missing API key'
                errors: 'structuring service error (401): Invalid or missing API key'
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Sebuah tahap tidak terjangkau
          content:
            application/json:
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: structuring service is unavailable
                errors: structuring service is unavailable
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Sebuah tahap tidak menjawab tepat waktu
          content:
            application/json:
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: structuring service timed out after 10.0s
                errors: structuring service timed out after 10.0s
                pipeline_last_stage: orchestrator
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id yang dibuat Orkestrasi pusat
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Hanya `slip_gaji`; selain itu 400 `UNSUPPORTED_DOCUMENT_TYPE`
          default: slip_gaji
          examples:
          - slip_gaji
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'Service yang dijalankan, berurutan: `guardrails`, `extraction`, `structuring`,
            `scoring` — JSON array atau field berulang. Tidak dikirim: keempatnya'
          examples:
          - '["guardrails","extraction","structuring","scoring"]'
        guardrails_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Guardrails Confidence Threshold
          description: 'JSON object per guardrail, sisi accept, 0 < x < 1: `{"acc_rej": 0.8}` (= `identity`,
            P(slip gaji)), `{"blur": 0.7}` (P(terbaca)). Tidak dikirim: ambang bawaan tiap service guardrail'
          examples:
          - '{"acc_rej": 0.8}'
        column_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Column Confidence Threshold
          description: 'JSON per field, sisi accept: `{"all_field": 0.8}` untuk semua field, atau `{"gaji_bersih":
            0.9}`; kunci field sendiri menang atas `all_field`. Field yang tidak disebut: `FIELD_CONFIDENCE_THRESHOLD`
            (0,5)'
          examples:
          - '{"all_field": 0.8}'
      type: object
      required:
      - request_id
      title: Body_extractOcr
    ContractField:
      properties:
        value:
          title: Value
          description: Nilai yang terbaca; null bila field tidak ditemukan. Nominal uang berupa integer
            rupiah
          examples:
          - PT SUMBER REJEKI MAKMUR
        confidence:
          type: integer
          enum:
          - 0
          - 1
          title: Confidence
          description: '1 ketika probabilitas model keyakinan (0-1) mencapai ambang field ini: `column_confidence_threshold`
            permintaan, atau `FIELD_CONFIDENCE_THRESHOLD` (bawaan 0,5); 0 ketika lebih rendah, atau ketika
            tidak ada nilainya. Terukur out-of-fold pada ambang 0,80: precision 93,4%, recall 75,6%'
          examples:
          - 1
      type: object
      required:
      - confidence
      title: ContractField
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    ExtractOcrResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Sama dengan kode status HTTP
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Frasa standar HTTP untuk `status_code`
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Untuk dibaca manusia; kalimatnya bisa berubah, jadi bercabanglah pada `errors`
          examples:
          - OCR extraction completed successfully
        data:
          anyOf:
          - $ref: '#/components/schemas/SlipGajiData'
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: 'Pipeline penuh (atau berakhir di `scoring`): `{total_slip, slip[]}`, tiap field
            `{value, confidence 0/1}`. Berakhir lebih awal: hasil service terakhir apa adanya — `["guardrails"]`
            laporan guardrail `{passed, reason, document, pages, checks, skipped, unavailable}`; `extraction`
            hasil OCR `{engine, model, elapsed_ms, n_pages, full_text, pages}`; `structuring` `{document_type,
            total_slip, slips, llm_used, reject_reason}`. Null bila gagal atau masih diproses'
        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Kode kegagalan ketika permintaan gagal atau ditolak; null selain itu
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: request_id milik respons ini
        guardrails:
          anyOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: 'null'
          title: Guardrails
          description: 1 = ditolak (ketiga guardrail, atau aturan structuring), 0 = tidak ditolak, null
            = masih diproses atau error sebelum dokumen dinilai
          examples:
          - 0
        pipeline_last_stage:
          anyOf:
          - type: string
            enum:
            - orchestrator
            - guardrails
            - extraction
            - structuring
            - scoring
          - type: 'null'
          title: Pipeline Last Stage
          description: 'Null pada jawaban sukses (200, 202). Pada galat: service asal galat, dengan nama
            yang sama seperti di `pipeline_name_sequence` — yang menolak (`guardrails`: guardrail-blank
            / -blur / -identity, atau `structuring`), yang gagal, atau yang tidak terjangkau — atau `orchestrator`
            bila permintaan ditolak pintu masuk sendiri sebelum satu pun service pipeline dipanggil (kunci
            API, berkas, urutan, ambang, `document_type`, request_id tidak dikenal pada `GET`)'
          examples:
          - structuring
      type: object
      required:
      - status_code
      - status_desc
      - message
      title: ExtractOcrResponse
    HealthResponse:
      properties:
        status:
          type: string
          title: Status
          description: '`healthy` (HTTP 200) or `unhealthy` (HTTP 503)'
          examples:
          - healthy
        version:
          type: string
          title: Version
          description: Service version
          examples:
          - 1.0.0
        detail:
          anyOf:
          - type: string
          - type: 'null'
          title: Detail
          description: The cause when `unhealthy`; null when healthy
          examples:
          - null
        device:
          type: string
          title: Device
          description: Where this service computes
          examples:
          - cpu
        backends:
          additionalProperties:
            type: string
          type: object
          title: Backends
          description: Active implementation per concern (model backend, storage). Useful to confirm a
            deployment
          examples:
          - ekstraksi: paddle
            storage: postgres
      type: object
      required:
      - status
      - version
      - device
      - backends
      title: HealthResponse
      description: '`GET /health`.'
    ReadyResponse:
      properties:
        status:
          type: string
          enum:
          - ready
          - not_ready
          title: Status
          description: '`ready` (HTTP 200) when every check is `ok`, else `not_ready` (HTTP 503)'
          examples:
          - ready
        checks:
          additionalProperties:
            type: string
            enum:
            - ok
            - failed
          type: object
          title: Checks
          description: One entry per REQUIRED dependency of this service; empty when it has none
          examples:
          - database: ok
      type: object
      required:
      - status
      - checks
      title: ReadyResponse
      description: '`GET /ready`.'
    Slip:
      properties:
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
          description: Halaman asal slip ini
          examples:
          - 1
        nama_perusahaan:
          $ref: '#/components/schemas/ContractField'
          description: Nama perusahaan pemberi kerja, apa adanya termasuk bentuk badan usaha (PT, CV)
            **Wajib**.
          examples:
          - confidence: 1
            value: PT SUMBER REJEKI MAKMUR
        periode:
          $ref: '#/components/schemas/ContractField'
          description: Periode gaji, dinormalkan ke `YYYY-MM` **Wajib**.
          examples:
          - confidence: 1
            value: 2025-02
        nama_karyawan:
          $ref: '#/components/schemas/ContractField'
          description: Nama karyawan **Wajib**.
          examples:
          - confidence: 1
            value: ANDI SAPUTRA
        nomor_induk_karyawan:
          $ref: '#/components/schemas/ContractField'
          description: Nomor induk karyawan / NIK internal perusahaan
          examples:
          - confidence: 1
        jabatan:
          $ref: '#/components/schemas/ContractField'
          description: Jabatan
          examples:
          - confidence: 1
        divisi:
          $ref: '#/components/schemas/ContractField'
          description: Divisi / departemen
          examples:
          - confidence: 1
        status_pegawai:
          $ref: '#/components/schemas/ContractField'
          description: Status kepegawaian (mis. Tetap, Kontrak)
          examples:
          - confidence: 1
        gaji_pokok:
          $ref: '#/components/schemas/ContractField'
          description: Gaji pokok, rupiah **Wajib**.
          examples:
          - confidence: 1
            value: 4500000
        tunjangan_jabatan:
          $ref: '#/components/schemas/ContractField'
          description: Tunjangan jabatan, rupiah
          examples:
          - confidence: 1
            value: 0
        tunjangan_transport:
          $ref: '#/components/schemas/ContractField'
          description: Tunjangan transport, rupiah
          examples:
          - confidence: 1
            value: 0
        tunjangan_makan:
          $ref: '#/components/schemas/ContractField'
          description: Tunjangan makan, rupiah
          examples:
          - confidence: 1
            value: 0
        tunjangan_komunikasi:
          $ref: '#/components/schemas/ContractField'
          description: Tunjangan komunikasi, rupiah
          examples:
          - confidence: 1
            value: 0
        tunjangan_lain:
          $ref: '#/components/schemas/ContractField'
          description: Tunjangan lain-lain, rupiah
          examples:
          - confidence: 1
            value: 0
        bonus:
          $ref: '#/components/schemas/ContractField'
          description: Bonus, rupiah
          examples:
          - confidence: 1
            value: 0
        insentif:
          $ref: '#/components/schemas/ContractField'
          description: Insentif, rupiah
          examples:
          - confidence: 1
            value: 0
        lembur:
          $ref: '#/components/schemas/ContractField'
          description: Upah lembur, rupiah
          examples:
          - confidence: 1
            value: 0
        thr:
          $ref: '#/components/schemas/ContractField'
          description: Tunjangan hari raya, rupiah
          examples:
          - confidence: 1
            value: 0
        total_pendapatan:
          $ref: '#/components/schemas/ContractField'
          description: Total pendapatan sebelum potongan, rupiah **Wajib**.
          examples:
          - confidence: 1
            value: 6680000
        total_potongan:
          $ref: '#/components/schemas/ContractField'
          description: Total potongan, rupiah
          examples:
          - confidence: 1
            value: 0
        gaji_bersih:
          $ref: '#/components/schemas/ContractField'
          description: Gaji bersih yang diterima; diturunkan bila tidak tercetak (total pendapatan − total
            potongan) **Wajib**.
          examples:
          - confidence: 1
            value: 6455000
        missing_mandatory_fields:
          items:
            type: string
          type: array
          title: Missing Mandatory Fields
          description: Field wajib yang tidak terisi pada slip ini; daftar kosong berarti lengkap
          examples:
          - []
      type: object
      required:
      - nama_perusahaan
      - periode
      - nama_karyawan
      - nomor_induk_karyawan
      - jabatan
      - divisi
      - status_pegawai
      - gaji_pokok
      - tunjangan_jabatan
      - tunjangan_transport
      - tunjangan_makan
      - tunjangan_komunikasi
      - tunjangan_lain
      - bonus
      - insentif
      - lembur
      - thr
      - total_pendapatan
      - total_potongan
      - gaji_bersih
      title: Slip
      description: 'Satu slip gaji: 20 field ber-`{value, confidence}`, halamannya, dan field wajib yang
        kosong.'
    SlipGajiData:
      properties:
        total_slip:
          type: integer
          minimum: 0.0
          title: Total Slip
          description: Jumlah slip di dokumen ini. Satu berkas lazim memuat tiga bulan berturut-turut
          examples:
          - 3
        slip:
          items:
            $ref: '#/components/schemas/Slip'
          type: array
          title: Slip
          description: 'Satu entri per slip, urut halaman. Setiap entri berdiri sendiri: totalnya milik
            bulan itu saja'
      type: object
      required:
      - total_slip
      - slip
      title: SlipGajiData
  securitySchemes:
    APIKeyHeader:
      type: apiKey
      description: API key for this service
      in: header
      name: X-API-Key
tags:
- name: Extract OCR
  description: Mulai pipeline untuk sebuah dokumen, dan baca posisi permintaan
- name: Health
  description: Health and readiness checks; no API key
