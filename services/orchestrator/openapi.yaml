openapi: 3.1.0
info:
  title: OCR Slip Gaji Orchestrator API
  description: 'Pintu masuk pipeline OCR Slip Gaji (`ms-bribrain-nilam-ocr-slipgaji-orchestrator`), dan
    satu-satunya service yang dipanggil Orkestrasi pusat. Kontraknya mengikuti API spec NILAM [07].


    `POST /v1/extract-ocr` memeriksa berkasnya, menyerahkannya ke tahap OCR, dan menunggu sampai service
    terakhir `pipeline_name_sequence` selama `PIPELINE_WAIT_SECONDS`: 200 dengan hasilnya, atau 202 selama
    masih berjalan. `GET /v1/extract-ocr/{request_id}` menjawab kontrak yang sama kapan pun sesudahnya.


    **Satu dokumen bisa berisi beberapa slip**: `data` memuat `total_slip` dan array `slip`, satu entri
    per halaman.


    **Guardrail dijalankan tahap OCR, bukan di sini**: ketiga service guardrail (blank, blur, identity)
    membaca teks OCR, jadi penilaiannya baru mungkin setelah dokumen dibaca. Penolakannya sampai ke klien
    sebagai 400 dengan `guardrails: 1` dan `pipeline_last_stage: guardrails`.


    Service ini tidak menyimpan apa pun: job disimpan tiap tahap, dan tahap itu pula yang mengirim callback
    hasil. Semua endpoint kecuali /health, /ready dan /metrics memerlukan header X-API-Key.


    ## Conventions (the same for every nilam-ocr service)


    **Authentication.** Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.

    A missing or wrong key answers `401`. The services are reachable only from inside the cluster.


    **Envelope.** Every JSON response, success or error, has the same shape:

    `{status_code, status_desc, message, data, errors, request_id}`. `status_code` always equals the HTTP

    status. On success `errors` is null; on error `data` is null.


    **Errors.** `errors` is a stable, machine-readable code; branch on it, not on the wording of `message`.

    The document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`, `TOO_MANY_PAGES`,

    `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE` (413). Otherwise the code of the
    status:

    `UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an unknown request_id), `NOT_FOUND` (404, a path
    that does

    not exist), `METHOD_NOT_ALLOWED` (405), `VALIDATION_ERROR` (422), `INTERNAL_SERVER_ERROR` (500),

    `DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT` (504), unless an endpoint documents a more precise
    one.

    `400` = the request or the document is unusable (do not retry unchanged). `503` / `504` are safe to
    retry.


    **request_id.** Minted by the central orchestrator and carried through every stage. Where an endpoint
    has

    no request_id of its own, the `X-Request-ID` request header is used (and echoed in the response header);

    without it the service generates one.


    **Asynchronous stages** (internal: only the orchestrator SLIP_GAJI and the previous stage call them).
    `POST

    .../jobs` answers `202` immediately and does the work in the background. The outcome is reported by
    a

    callback to the central orchestrator (see *Webhooks*), and can be read at any time with

    `GET .../jobs/{request_id}`, which the orchestrator SLIP_GAJI''s `GET /v1/extract-ocr/{request_id}`
    combines

    over the three stages. Submitting the same request_id again is idempotent:

    `202` with `duplicate: true`, the work is not repeated, unless the earlier attempt `FAILED` or has
    been

    `PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`, 5 minutes by default: the

    process running it died). A job still running when the service shuts down is reported `FAILED`. Because

    the request was already answered `202`, a problem with the document itself (unreadable file, no text,

    unsupported document type) shows up as a `FAILED` job and callback, not as a `4xx`.

    '
  version: 1.0.0
servers:
- url: /
  description: This host (where this page is served)
- url: http://ms-bribrain-nilam-ocr-slipgaji.{namespace}.svc.cluster.local:8034
  description: 'GKE, from another namespace: the entry Service (the central orchestrator / gateway)'
  variables:
    namespace:
      default: ms-bribrain-nilam-ocr-slipgaji
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-slipgaji)'
- url: http://ms-bribrain-nilam-ocr-slipgaji-orchestrator.{namespace}.svc.cluster.local:8034
  description: GKE, from inside the release's namespace (the other services of this pipeline)
  variables:
    namespace:
      default: ms-bribrain-nilam-ocr-slipgaji
      description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-slipgaji)'
- url: http://orchestrator:8034
  description: The Docker Compose network
- url: http://127.0.0.1:8034
  description: Local development
paths:
  /health:
    get:
      tags:
      - Health
      summary: Health check, including the database
      description: 'Says whether the service can reach what it depends on: 200 `healthy` when every dependency
        it checks answers (the database, for a service that has one), 503 `unhealthy` with the cause in
        `detail` otherwise. Each check gives up after 3 s. Also lists the active implementations (`backends`).
        Not used by the Kubernetes probes: liveness and startup check the port, readiness is `/ready`.
        Does not require an API key.'
      operationId: getHealth
      responses:
        '200':
          description: Every dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                healthy:
                  summary: Healthy
                  value:
                    status: healthy
                    version: 1.0.0
                    device: cpu
                    backends: {}
        '503':
          description: A dependency does not answer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: unhealthy
                version: 1.0.0
                detail: database unreachable
                device: cpu
                backends: {}
  /ready:
    get:
      tags:
      - Health
      summary: Readiness probe
      description: 'The readiness probe. Liveness is checked on the port, never on a dependency (a database
        blip must not make Kubernetes restart every pod). /ready says whether this pod can do its job
        right now: 200 when every REQUIRED dependency of this service answers, 503 otherwise, so the pod
        is taken out of the Service until it recovers. Downstream stages and model services are deliberately
        not checked: their outage is reported per job, not by refusing traffic. Does not require an API
        key.'
      operationId: getReadiness
      responses:
        '200':
          description: Every required dependency answers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              examples:
                ready:
                  summary: Ready
                  value:
                    status: ready
                    checks: {}
        '503':
          description: A required dependency is unavailable; the pod is taken out of the Service
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadyResponse'
              example:
                status: not_ready
                checks: {}
  /metrics:
    get:
      tags:
      - Health
      summary: Prometheus metrics
      description: 'Prometheus text exposition of this process: `http_requests_total` and `http_request_duration_seconds`
        per route template, and for the pipeline stages `pipeline_jobs_total` (by outcome), `pipeline_job_duration_seconds`,
        `pipeline_stale_jobs_reclaimed_total`, `pipeline_outbox_deliveries_total` and the outbox backlog
        gauges (`pipeline_outbox_pending`, `_retrying`, `_dead_letters`, `_oldest_pending_seconds`). Scraped
        inside the cluster; does not require an API key.'
      operationId: getMetrics
      responses:
        '200':
          description: Metrics in the Prometheus text format
          content:
            text/plain:
              schema:
                type: string
  /v1/extract-ocr:
    post:
      tags:
      - Extract OCR
      summary: Jalankan pipeline atas sebuah dokumen slip gaji, jawab hasilnya atau 202
      description: '**Satu-satunya panggilan Orkestrasi pusat.** Memeriksa berkas (tipe, `MAX_UPLOAD_BYTES`
        2,5 MB, `MAX_DOCUMENT_PAGES`), menyerahkannya ke tahap OCR, lalu menunggu sampai service terakhir
        `pipeline_name_sequence` selama `PIPELINE_WAIT_SECONDS` (bawaan 15 detik). Bila belum selesai:
        202 dan hasil dikirim lewat callback, atau dibaca dengan `GET /v1/extract-ocr/{request_id}`.


        | Hasil | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Selesai | 200 | hasil service terakhir | `0` | null | null |

        | Masih berjalan | 202 | null | null | null | null |

        | Ditahan guardrail | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails` |

        | Ditolak aturan structuring | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | Sebuah tahap gagal | 422 | null | `0` | `OCR_FAILED` / `STRUCTURING_FAILED` / `SCORING_FAILED`
        | tahap itu |


        Status HTTP (juga `status_code`) menyatakan keadaan permintaan: 200 selesai, 202 masih berjalan,
        4xx / 5xx gagal atau ditolak. `pipeline_last_stage` null pada jawaban sukses (200, 202) dan menyebut
        service asal galat, atau `orchestrator` bila ditolak pintu masuk sendiri.


        **`pipeline_name_sequence` (saklar service).** Urutan baku `guardrails -> extraction -> structuring
        -> scoring`; `guardrails` boleh dilewati dari depan, ekor boleh dipotong, tengah tidak boleh dilewati;
        pelanggaran 422 `INVALID_PIPELINE_SEQUENCE`. Service terakhir mengakhiri permintaan dan hasilnya
        menjadi `data` apa adanya.


        **Guardrail slip gaji membaca teks OCR** (AUC 0,911, piksel hanya 0,638), jadi `guardrails` dijalankan
        tahap OCR setelah dokumen dibaca: ketiga service guardrail-blank, guardrail-blur, guardrail-identity
        dipanggil bersamaan, masing-masing bisa dimatikan sendiri. Akibatnya `["guardrails"]` pun menjalankan
        OCR, dan bisa dijawab 202 bila melewati masa tunggu.


        **Satu dokumen bisa berisi beberapa slip** (tiga bulan dalam satu berkas adalah bentuk yang paling
        sering diunggah), jadi `data` pipeline penuh berisi `total_slip` dan array `slip`, satu entri
        per halaman.


        **Confidence.** Setiap field `{value, confidence}`; `confidence` 1 ketika probabilitas model keyakinan
        (0-1) >= ambang field itu, selain itu 0. Callback hasil membawa `data` yang sama persis.


        **Ambang per permintaan, semuanya sisi accept (tanpa `guardrails_tendency`).** `guardrails_confidence_threshold`
        = JSON object per guardrail: `{"acc_rej": 0.8}` (= `identity`, P(slip gaji)) dan/atau `{"blur":
        0.7}` (P(terbaca) = 1 - p_broken), 0 < x < 1. Tidak dikirim: ambang bawaan tiap service guardrail.
        `column_confidence_threshold` = JSON object per field; `all_field` disebar ke ke-20 field dan
        kunci field sendiri menang. Field yang tidak disebut: `FIELD_CONFIDENCE_THRESHOLD` (0,5). Ambang
        yang tidak terbaca atau kunci tak dikenal: 422 `INVALID_THRESHOLD`, tidak ada yang dijalankan.


        **Idempotensi.** request_id yang sama tidak menjalankan pipeline dua kali kecuali percobaan OCR
        sebelumnya `FAILED` atau melewati sewa job (`PIPELINE_JOB_LEASE_SECONDS`).'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
