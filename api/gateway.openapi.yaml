              example:
                status_code: 413
                status_desc: Payload Too Large
                message: Ukuran dokumen melebihi batas 2,5 MB, pastikan hanya mengunggah dokumen slip
                  gaji
                errors: FILE_TOO_LARGE
                pipeline_last_stage: orchestrator
        '422':
          description: '`INVALID_PIPELINE_SEQUENCE`, `INVALID_THRESHOLD`, `VALIDATION_ERROR` (tidak ada
            yang dijalankan), atau sebuah tahap gagal: `OCR_FAILED`, `STRUCTURING_FAILED`, `SCORING_FAILED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 422
                status_desc: Unprocessable Entity
                message: 'Invalid pipeline_name_sequence: services must keep the order guardrails -> extraction
                  -> structuring -> scoring without skipping one in the middle'
                errors: INVALID_PIPELINE_SEQUENCE
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: orchestrator
        '500':
          description: Service extraction menjawab bentuk tak terduga
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 500
                status_desc: Internal Server Error
                message: extraction service returned an unexpected response
                errors: extraction service returned an unexpected response
                pipeline_last_stage: orchestrator
        '503':
          description: Service extraction tidak terjangkau; tidak ada yang dijalankan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 503
                status_desc: Service Unavailable
                message: extraction service is unavailable
                errors: extraction service is unavailable
                pipeline_last_stage: orchestrator
        '504':
          description: Service extraction tidak menjawab tepat waktu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status_code: 504
                status_desc: Gateway Timeout
                message: extraction service timed out after 10.0s
                errors: extraction service timed out after 10.0s
                pipeline_last_stage: orchestrator
