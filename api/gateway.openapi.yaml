        variables:
          namespace:
            default: ms-bribrain-nilam-ocr-slipgaji
            description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-slipgaji)'
      - url: http://ms-bribrain-nilam-ocr-slipgaji-orchestrator.{namespace}.svc.cluster.local:8034
        description: GKE, from inside the release's namespace (the other services of this pipeline)
        variables:
          namespace:
            default: ms-bribrain-nilam-ocr-slipgaji
            description: 'Namespace of the Helm release (deploy/helm/deploy.sh: nilam-ocr-slipgaji)'
      - url: http://orchestrator:8034
        description: The Docker Compose network
      - url: http://127.0.0.1:8034
        description: Local development
  /v1/extract-ocr/{request_id}:
    get:
      tags:
      - 3. Status
      summary: 'Di mana sebuah permintaan sekarang: jawaban extract-ocr, tanpa menunggu'
      description: 'Membaca job tiap tahap milik `request_id` sekali, sampai service terakhir `pipeline_name_sequence`
        permintaan itu (tersimpan bersama job OCR), dan menjawab dengan kontrak yang sama seperti `POST
        /v1/extract-ocr` — termasuk confidence menurut `column_confidence_threshold` yang dikirim saat
        POST:


        | Hasil | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Selesai | 200 | hasil service terakhir | `0` | null | null |

        | Masih berjalan | 202 | null | null | null | null |

        | Ditahan guardrail | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails` |

        | Ditolak aturan structuring | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | Sebuah tahap gagal | 422 | null | `0` | `OCR_FAILED` / `STRUCTURING_FAILED` / `SCORING_FAILED`
        | tahap itu |


        Status HTTP (juga `status_code`) menyatakan keadaan permintaan: 200 selesai, 202 masih berjalan,
        4xx / 5xx gagal atau ditolak. `pipeline_last_stage` null pada jawaban sukses (200, 202) dan menyebut
        service asal galat, atau `orchestrator` bila ditolak pintu masuk sendiri.


        **404** `REQUEST_ID_NOT_FOUND`: tidak ada job untuk request_id ini.


        **Batasan.** Penyerahan antar dua tahap yang gagal permanen membuat tahap berikutnya tidak punya
        job, sehingga endpoint ini terus menjawab `202`. Callback `FAILED` dan tabel Orkestrasi pusat
        yang menyimpan keadaan akhir itu.'
      operationId: getExtractOcr
      security:
      - APIKeyHeader: []
      parameters:
      - name: request_id
        in: path
        required: true
        schema:
          type: string
          title: Request Id
