                status_desc: Unauthorized
                message: Invalid or missing API key
                errors: Invalid or missing API key
                pipeline_last_stage: orchestrator
        '413':
          description: Dokumen melebihi `MAX_UPLOAD_BYTES` (2,5 MB); tidak ada yang dijalankan
