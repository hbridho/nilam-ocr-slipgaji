        '202':
          description: Masih berjalan saat masa tunggu habis
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              examples:
                processing:
                  summary: Masih diproses
                  value:
                    status_code: 202
                    status_desc: Accepted
                    message: OCR job accepted; still processing
                    request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
        '400':
          description: 'Ditahan guardrail atau ditolak aturan structuring (`DOWNSTREAM_VALIDATION_ERROR`,
            `guardrails: 1`), `UNSUPPORTED_DOCUMENT_TYPE`, `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`, `UNREADABLE_FILE`,
            `TOO_MANY_PAGES` (`Jumlah halaman melebihi batas, pastikan hanya mengunggah dokumen slip gaji`),
            `INVALID_FILE_SOURCE`, `FILE_URL_REJECTED`'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractOcrResponse'
              example:
                status_code: 400
                status_desc: Bad Request
                message: Dokumen ini bukan slip gaji. Mohon unggah slip gaji.
                errors: DOWNSTREAM_VALIDATION_ERROR
                request_id: OCR_9cb01af2-493d-446d-b191-af120333f6d0
                pipeline_last_stage: guardrails
