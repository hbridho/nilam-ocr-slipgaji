openapi: 3.1.0
info:
  title: 'NILAM OCR Slip Gaji: gateway integration API'
  version: 1.0.0
  description: "Everything the central orchestrator / gateway needs to integrate the **slip gaji** OCR\
    \ pipeline, merged from\nthe services' own specs. The contract follows the NILAM API spec [07] (NPWP),\
    \ with a `data` shaped for slip\ngaji. Each service also serves its full Swagger UI at `/docs`.\n\n\
    ## The flow\n\n1. **`POST /v1/extract-ocr`** on `ms-bribrain-nilam-ocr-slipgaji-orchestrator` (port\
    \ `8034`) with your\n   `request_id` and the document (`file` or `file_url`; optional `params`, `pipeline_name_sequence`,\n\
    \   `guardrails_confidence_threshold` + `guardrails_tendency`, `column_confidence_threshold`). The\
    \ document is\n   checked (type, 2,5 MB, page limit), then read by OCR, judged by the three guardrail\
    \ services\n   (blank, blur, identity — they read OCR text, so they run right after OCR), structured\
    \ and scored. The\n   service waits up to `PIPELINE_WAIT_SECONDS` (15 s):\n   - finished -> **200**,\
    \ `data` = `{total_slip, slip[]}`, every field `{value, confidence 0/1}`;\n   - rejected by a guardrail\
    \ -> **400** `DOWNSTREAM_VALIDATION_ERROR`, `guardrails: 1`,\n     `pipeline_last_stage: guardrails`;\
    \ by the structuring rules -> same, `pipeline_last_stage: structuring`;\n   - a stage failed -> **422**\
    \ `OCR_FAILED` / `STRUCTURING_FAILED` / `SCORING_FAILED`;\n   - still running -> **202**; the result\
    \ arrives by callback.\n2. **Receive the callback** (see *Webhooks*): one result per request, with\
    \ the raw 0-1 probabilities.\n3. **Read the status when needed** with `GET /v1/extract-ocr/{request_id}`:\
    \ the same contract, without waiting.\n\n## Scores\n\nEvery score is a probability on a 0-1 scale.\
    \ `confidence` in `data` is 1 when the confidence model's\nprobability that the value is correct reaches\
    \ the field's threshold (`column_confidence_threshold`, then\n`all_field`, then `FIELD_CONFIDENCE_THRESHOLD`\
    \ = 0.5). There is no document-level score.\n\n## Addresses\n\nThe orchestrator is the only service\
    \ you call. From another namespace in GKE:\n`http://ms-bribrain-nilam-ocr-slipgaji.nilam-ocr-slipgaji.svc.cluster.local:8034`\
    \ (the release's entry\nService). The guardrail and stage services are internal. Nothing is exposed\
    \ outside the cluster.\n\n\n## Conventions (the same for every nilam-ocr service)\n\n**Authentication.**\
    \ Every endpoint except `/health`, `/ready` and `/metrics` requires the header `X-API-Key`.\nA missing\
    \ or wrong key answers `401`. The services are reachable only from inside the cluster.\n\n**Envelope.**\
    \ Every JSON response, success or error, has the same shape:\n`{status_code, status_desc, message,\
    \ data, errors, request_id}`. `status_code` always equals the HTTP\nstatus. On success `errors` is\
    \ null; on error `data` is null.\n\n**Errors.** `errors` is a stable, machine-readable code; branch\
    \ on it, not on the wording of `message`.\nThe document checks: `EMPTY_FILE`, `UNSUPPORTED_FILE_TYPE`,\
    \ `UNREADABLE_FILE`, `TOO_MANY_PAGES`,\n`INVALID_FILE_SOURCE`, `FILE_URL_REJECTED` (400), `FILE_TOO_LARGE`\
    \ (413). Otherwise the code of the status:\n`UNAUTHORIZED` (401), `REQUEST_ID_NOT_FOUND` (404, an\
    \ unknown request_id), `NOT_FOUND` (404, a path that does\nnot exist), `METHOD_NOT_ALLOWED` (405),\
    \ `VALIDATION_ERROR` (422), `INTERNAL_SERVER_ERROR` (500),\n`DOWNSTREAM_UNAVAILABLE` (503), `DOWNSTREAM_TIMEOUT`\
    \ (504), unless an endpoint documents a more precise one.\n`400` = the request or the document is\
    \ unusable (do not retry unchanged). `503` / `504` are safe to retry.\n\n**request_id.** Minted by\
    \ the central orchestrator and carried through every stage. Where an endpoint has\nno request_id of\
    \ its own, the `X-Request-ID` request header is used (and echoed in the response header);\nwithout\
    \ it the service generates one.\n\n**Asynchronous stages** (internal: only the orchestrator SLIP_GAJI\
    \ and the previous stage call them). `POST\n.../jobs` answers `202` immediately and does the work\
    \ in the background. The outcome is reported by a\ncallback to the central orchestrator (see *Webhooks*),\
    \ and can be read at any time with\n`GET .../jobs/{request_id}`, which the orchestrator SLIP_GAJI's\
    \ `GET /v1/extract-ocr/{request_id}` combines\nover the three stages. Submitting the same request_id\
    \ again is idempotent:\n`202` with `duplicate: true`, the work is not repeated, unless the earlier\
    \ attempt `FAILED` or has been\n`PROCESSING` for longer than the job lease (`PIPELINE_JOB_LEASE_SECONDS`,\
    \ 5 minutes by default: the\nprocess running it died). A job still running when the service shuts\
    \ down is reported `FAILED`. Because\nthe request was already answered `202`, a problem with the document\
    \ itself (unreadable file, no text,\nunsupported document type) shows up as a `FAILED` job and callback,\
    \ not as a `4xx`.\n"
tags:
- name: 1. Start the pipeline
  description: 'The call you make: OCR -> guardrails (blank, blur, identity) -> structuring -> scoring,
    waited on for up to PIPELINE_WAIT_SECONDS; answers in the NILAM extract-ocr contract (API spec [07]).
    200: the result of the last service. 202: still running, the result arrives by callback. 400: rejected.
    422: a stage failed.'
- name: 2. Callbacks (you implement this)
  description: 'Listed under **Webhooks**: the request each stage sends to you when it finishes.'
- name: 3. Status
  description: 'Where a request is now, in the same contract, without waiting: e.g. after a 202 whose
    callback did not arrive.'
paths:
  /v1/extract-ocr:
    post:
      tags:
      - 1. Start the pipeline
      summary: Jalankan pipeline atas sebuah dokumen slip gaji, jawab hasilnya atau 202
      description: '**Satu-satunya panggilan Orkestrasi pusat.** Memeriksa berkas (tipe, `MAX_UPLOAD_BYTES`
        2,5 MB, `MAX_DOCUMENT_PAGES`), menyerahkannya ke tahap OCR, lalu menunggu sampai service terakhir
        `pipeline_name_sequence` selama `PIPELINE_WAIT_SECONDS` (bawaan 15 detik). Bila belum selesai:
        202 dan hasil dikirim lewat callback, atau dibaca dengan `GET /v1/extract-ocr/{request_id}`.


        | Hasil | HTTP | `data` | `guardrails` | `errors` | `pipeline_last_stage` |

        |---|---|---|---|---|---|

        | Selesai | 200 | hasil service terakhir | `0` | null | null |

        | Masih berjalan | 202 | null | null | null | null |

        | Ditahan guardrail | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `guardrails` |

        | Ditolak aturan structuring | 400 | null | `1` | `DOWNSTREAM_VALIDATION_ERROR` | `structuring`
        |

        | Sebuah tahap gagal | 422 | null | `0` | `OCR_FAILED` / `STRUCTURING_FAILED` / `SCORING_FAILED`
        | tahap itu |


        Status HTTP (juga `status_code`) menyatakan keadaan permintaan: 200 selesai, 202 masih berjalan,
        4xx / 5xx gagal atau ditolak. `pipeline_last_stage` null pada jawaban sukses (200, 202) dan menyebut
        service asal galat, atau `orchestrator` bila ditolak pintu masuk sendiri.


        **`pipeline_name_sequence` (saklar service).** Urutan baku `guardrails -> extraction -> structuring
        -> scoring`; `guardrails` boleh dilewati dari depan, ekor boleh dipotong, tengah tidak boleh dilewati;
        pelanggaran 422 `INVALID_PIPELINE_SEQUENCE`. Service terakhir mengakhiri permintaan dan hasilnya
        menjadi `data` apa adanya.


        **Guardrail slip gaji membaca teks OCR** (AUC 0,911, piksel hanya 0,638), jadi `guardrails` dijalankan
        tahap OCR setelah dokumen dibaca: ketiga service guardrail-blank, guardrail-blur, guardrail-identity
        dipanggil bersamaan, masing-masing bisa dimatikan sendiri. Akibatnya `["guardrails"]` pun menjalankan
        OCR, dan bisa dijawab 202 bila melewati masa tunggu.


        **Satu dokumen bisa berisi beberapa slip** (tiga bulan dalam satu berkas adalah bentuk yang paling
        sering diunggah), jadi `data` pipeline penuh berisi `total_slip` dan array `slip`, satu entri
        per halaman.


        **Confidence.** Setiap field `{value, confidence}`; `confidence` 1 ketika probabilitas model keyakinan
        (0-1) >= ambang field itu, selain itu 0. Callback hasil membawa `data` yang sama persis.


        **Ambang per permintaan, semuanya sisi accept (tanpa `guardrails_tendency`).** `guardrails_confidence_threshold`
        = JSON object per guardrail: `{"acc_rej": 0.8}` (= `identity`, P(slip gaji)) dan/atau `{"blur":
        0.7}` (P(terbaca) = 1 - p_broken), 0 < x < 1. Tidak dikirim: ambang bawaan tiap service guardrail.
        `column_confidence_threshold` = JSON object per field; `all_field` disebar ke ke-20 field dan
        kunci field sendiri menang. Field yang tidak disebut: `FIELD_CONFIDENCE_THRESHOLD` (0,5). Ambang
        yang tidak terbaca atau kunci tak dikenal: 422 `INVALID_THRESHOLD`, tidak ada yang dijalankan.


        **Idempotensi.** request_id yang sama tidak menjalankan pipeline dua kali kecuali percobaan OCR
        sebelumnya `FAILED` atau melewati sewa job (`PIPELINE_JOB_LEASE_SECONDS`).'
      operationId: extractOcr
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_extractOcr'
        required: true
      responses:
        '200':
          description: Selesai di dalam masa tunggu
