webhooks:
  stageCallback:
    post:
      tags:
      - 2. Callbacks (you implement this)
      summary: Stage status callback (implemented by the orchestrator / gateway)
      description: '**This is a request this service SENDS, not one it accepts.** The orchestrator must
        expose it.


        `POST {ORCHESTRATION_URL}{ORCHESTRATION_CALLBACK_PATH}` (default path `/v1/callbacks/stage`),
        `Content-Type: application/json`.


        **When.** Once per stage, from the service that ran it:


        - **extraction**: Once per job of `POST /v1/extraction/jobs`: `stage: OCR` with `status: DONE`
        once the OCR result is stored, or `status: FAILED` with `error_message` when the document could
        not be read (the chain stops there). Additionally `stage: STRUCTURING`, `status: FAILED` when
        OCR succeeded but the structuring service could not be reached after retries. Without `PIPELINE_OUTBOX`
        the `OCR` callback is sent before the hand-off to structuring; with it the hand-off goes first,
        so the `STRUCTURING` callback may arrive before this one.

        - **structuring**: Once per job of `POST /v1/structuring/jobs`: `stage: STRUCTURING` with `status:
        DONE` once the fields are stored, or `status: FAILED` with `error_message` when the document has
        no text (the chain stops there). Additionally `stage: SCORING`, `status: FAILED` when structuring
        succeeded but the scoring service could not be reached after retries. Without `PIPELINE_OUTBOX`
        the `STRUCTURING` callback is sent before the hand-off to scoring; with it the hand-off goes first,
        so the `SCORING` callback may arrive before this one.

        - **scoring**: Once per job of `POST /v1/scoring/jobs`, the last callback of a request: `stage:
        SCORING` with `status: DONE` and `result` = the **final result** (fields, per-field confidences,
        and the guardrails result that was submitted), or `status: FAILED` with `error_message` and `result:
        null`.


        **Expected answer.** Any `2xx`; the body is ignored. `5xx`, a timeout or an unreachable host are
        retried (3 attempts by default, exponential back-off from 0.5 s). A `4xx` is NOT retried. A callback
        that still fails is logged and dropped: the job itself stays `DONE` / `FAILED`, so the orchestrator
        can reconcile with the orchestrator SLIP_GAJI''s `GET /v1/extract-ocr/{request_id}` and should
        time a request out on its own. With `PIPELINE_OUTBOX` the callback is instead queued in the same
        transaction as the result and retried with back-off (up to 5 minutes apart) for up to `PIPELINE_OUTBOX_MAX_AGE_SECONDS`
        (24 h by default); a `4xx`, or that age, makes it a dead letter that stays in the table and is
        counted by `GET .../outbox`.


        **What the receiver must tolerate.** The same callback may arrive more than once (treat it as
        idempotent), and callbacks of different stages come from different services, so they may arrive
        out of order: only ever move a request''s status forward. Reject callbacks whose `X-API-Key` is
        wrong.'
      operationId: stageCallback
      parameters:
      - description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
          `API_KEY`'
        required: true
        schema:
          type: string
          title: X-Api-Key
          description: '`ORCHESTRATION_API_KEY` of the sending service; when unset, that service''s own
            `API_KEY`'
        name: x-api-key
        in: header
      requestBody:
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/StageCallback'
              - $ref: '#/components/schemas/ScoringStageCallback'
              description: '`stage: SCORING` carries the final result in `result`; for the other stages
                `result` is null.'
        required: true
      responses:
        '200':
          description: Acknowledged. Any 2xx is accepted and the body is ignored.
          content:
            application/json:
              schema: {}
components:
  schemas:
    Body_extractOcr:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id yang dibuat Orkestrasi pusat
          examples:
          - OCR_9cb01af2-493d-446d-b191-af120333f6d0
        document_type:
          type: string
          title: Document Type
          description: Hanya `slip_gaji`; selain itu 400 `UNSUPPORTED_DOCUMENT_TYPE`
          default: slip_gaji
          examples:
          - slip_gaji
        file:
          anyOf:
          - type: string
            format: binary
          - type: string
          - type: 'null'
          title: File
          description: Document image (JPEG/PNG/PDF). Omit when sending file_url.
        file_url:
          anyOf:
          - type: string
          - type: 'null'
          title: File Url
          description: URL this service fetches the document image from (e.g. a presigned MinIO GET).
            Omit when uploading file. The host must be listed in the service's `FILE_URL_ALLOWED_HOSTS`,
            or resolve to a public address when that is empty; redirects are not followed.
        pipeline_name_sequence:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Pipeline Name Sequence
          description: 'Service yang dijalankan, berurutan: `guardrails`, `extraction`, `structuring`,
            `scoring` — JSON array atau field berulang. Tidak dikirim: keempatnya'
          examples:
          - '["guardrails","extraction","structuring","scoring"]'
        guardrails_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Guardrails Confidence Threshold
          description: 'JSON object per guardrail, sisi accept, 0 < x < 1: `{"acc_rej": 0.8}` (= `identity`,
            P(slip gaji)), `{"blur": 0.7}` (P(terbaca)). Tidak dikirim: ambang bawaan tiap service guardrail'
          examples:
          - '{"acc_rej": 0.8}'
        column_confidence_threshold:
          anyOf:
          - type: string
          - type: 'null'
          title: Column Confidence Threshold
          description: 'JSON per field, sisi accept: `{"all_field": 0.8}` untuk semua field, atau `{"gaji_bersih":
            0.9}`; kunci field sendiri menang atas `all_field`. Field yang tidak disebut: `FIELD_CONFIDENCE_THRESHOLD`
            (0,5)'
          examples:
          - '{"all_field": 0.8}'
      type: object
      required:
      - request_id
      title: Body_extractOcr
    ContractField:
      properties:
        value:
          title: Value
          description: Nilai yang terbaca; null bila field tidak ditemukan. Nominal uang berupa integer
            rupiah
          examples:
          - PT SUMBER REJEKI MAKMUR
        confidence:
          type: integer
          enum:
          - 0
          - 1
          title: Confidence
          description: '1 ketika probabilitas model keyakinan (0-1) mencapai ambang field ini: `column_confidence_threshold`
            permintaan, atau `FIELD_CONFIDENCE_THRESHOLD` (bawaan 0,5); 0 ketika lebih rendah, atau ketika
            tidak ada nilainya. Terukur out-of-fold pada ambang 0,80: precision 93,4%, recall 75,6%'
          examples:
          - 1
      type: object
      required:
      - confidence
      title: ContractField
    ErrorResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Same as the HTTP status code
          examples:
          - 400
        status_desc:
          type: string
          title: Status Desc
          description: Reason phrase of `status_code`
          examples:
          - Bad Request
        message:
          type: string
          title: Message
          description: Human-readable cause; safe to log
          examples:
          - Uploaded file is empty
        data:
          type: 'null'
          title: Data
          description: Always null on error
        errors:
          type: string
          title: Errors
          description: Machine-readable cause. `VALIDATION_ERROR` for 422 (branch on this, the message
            names a different field every time); for every other status it repeats `message`
          examples:
          - Uploaded file is empty
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: Present when the error is tied to a known request_id
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
      type: object
      required:
      - status_code
      - status_desc
      - message
      - errors
      title: ErrorResponse
      description: Every error response.
    ExtractOcrResponse:
      properties:
        status_code:
          type: integer
          title: Status Code
          description: Sama dengan kode status HTTP
          examples:
          - 200
        status_desc:
          type: string
          title: Status Desc
          description: Frasa standar HTTP untuk `status_code`
          examples:
          - OK
        message:
          type: string
          title: Message
          description: Untuk dibaca manusia; kalimatnya bisa berubah, jadi bercabanglah pada `errors`
          examples:
          - OCR extraction completed successfully
        data:
          anyOf:
          - $ref: '#/components/schemas/SlipGajiData'
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Data
          description: 'Pipeline penuh (atau berakhir di `scoring`): `{total_slip, slip[]}`, tiap field
            `{value, confidence 0/1}`. Berakhir lebih awal: hasil service terakhir apa adanya — `["guardrails"]`
            laporan guardrail `{passed, reason, document, pages, checks, skipped, unavailable}`; `extraction`
            hasil OCR `{engine, model, elapsed_ms, n_pages, full_text, pages}`; `structuring` `{document_type,
            total_slip, slips, llm_used, reject_reason}`. Null bila gagal atau masih diproses'
        errors:
          anyOf:
          - type: string
          - type: 'null'
          title: Errors
          description: Kode kegagalan ketika permintaan gagal atau ditolak; null selain itu
          examples:
          - null
        request_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Request Id
          description: request_id milik respons ini
        guardrails:
          anyOf:
          - type: integer
            enum:
            - 0
            - 1
          - type: 'null'
          title: Guardrails
          description: 1 = ditolak (ketiga guardrail, atau aturan structuring), 0 = tidak ditolak, null
            = masih diproses atau error sebelum dokumen dinilai
          examples:
          - 0
        pipeline_last_stage:
          anyOf:
          - type: string
            enum:
            - orchestrator
            - guardrails
            - extraction
            - structuring
            - scoring
          - type: 'null'
          title: Pipeline Last Stage
          description: 'Null pada jawaban sukses (200, 202). Pada galat: service asal galat, dengan nama
            yang sama seperti di `pipeline_name_sequence` — yang menolak (`guardrails`: guardrail-blank
            / -blur / -identity, atau `structuring`), yang gagal, atau yang tidak terjangkau — atau `orchestrator`
            bila permintaan ditolak pintu masuk sendiri sebelum satu pun service pipeline dipanggil (kunci
            API, berkas, urutan, ambang, `document_type`, request_id tidak dikenal pada `GET`)'
          examples:
          - structuring
      type: object
      required:
      - status_code
      - status_desc
      - message
      title: ExtractOcrResponse
    FinalResult:
      properties:
        document_type:
          type: string
          title: Document Type
          description: Jenis dokumen
          examples:
          - slip_gaji
        total_slip:
          type: integer
          minimum: 0.0
          title: Total Slip
          description: Jumlah slip di dokumen ini
          examples:
          - 3
        slips:
          items:
            $ref: '#/components/schemas/FinalSlip'
          type: array
          title: Slips
          description: Satu entri per slip. Probabilitas 0-1 dibiarkan apa adanya di sini; pemetaan ke
            confidence 0/1 terjadi di kontrak `extract-ocr`, supaya ambangnya bisa diubah tanpa melatih
            ulang apa pun
        guardrails:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsPayload'
          - type: 'null'
          description: Laporan guardrail dari tahap OCR, dikembalikan apa adanya
        llm_used:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Llm Used
          description: true bila arbitrase LLM dipakai saat structuring
      type: object
      required:
      - document_type
      - total_slip
      - slips
      title: FinalResult
      description: Apa yang dihasilkan pipeline untuk satu request_id. Dibawa callback SCORING / DONE.
    FinalSlip:
      properties:
        slip_no:
          type: integer
          minimum: 1.0
          title: Slip No
          examples:
          - 1
        page:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Page
          examples:
          - 1
        fields:
          additionalProperties: true
          type: object
          title: Fields
          description: 20 field; null bila tidak ditemukan
        scores:
          additionalProperties:
            type: number
          type: object
          title: Scores
          description: Probabilitas 0-1 per field yang ada nilainya
        missing_mandatory_fields:
          items:
            type: string
          type: array
          title: Missing Mandatory Fields
      type: object
      required:
      - slip_no
      - fields
      title: FinalSlip
      description: Satu slip pada hasil akhir.
    GuardrailsDocument:
      properties:
        verdict:
          anyOf:
          - type: string
            enum:
            - accepted
            - reject
            - skipped
          - type: 'null'
          title: Verdict
          description: Putusan dokumen
          examples:
          - accepted
        confidence:
          anyOf:
          - type: number
            maximum: 1.0
            minimum: 0.0
          - type: 'null'
          title: Confidence
          description: 'Lolos: P(slip gaji). Ditolak: keyakinan pada penolakan'
          examples:
          - 0.9934
        n_pages:
          anyOf:
          - type: integer
            minimum: 0.0
          - type: 'null'
          title: N Pages
          description: Halaman yang dinilai
          examples:
          - 3
        threshold:
          anyOf:
          - type: number
          - type: 'null'
          title: Threshold
          description: Ambang yang dipakai pemeriksaan penentu
          examples:
          - 0.47
      additionalProperties: true
      type: object
      title: GuardrailsDocument
      description: Putusan guardrail untuk dokumen ini (bentuk API spec [07]).
    GuardrailsPayload:
      properties:
        passed:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Passed
          description: 'true: dokumen boleh lanjut ke structuring'
          examples:
          - true
        reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Reason
          description: Alasan ditahan; null bila lolos
          examples:
          - null
        verdict:
          anyOf:
          - type: string
          - type: 'null'
          title: Verdict
          description: Putusan gabungan
          examples:
          - slip_gaji
        skipped:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Skipped
          description: Guardrail yang dimatikan (`GUARDRAIL_<NAMA>_ENABLED=false`)
          examples:
          - []
        unavailable:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Unavailable
          description: Guardrail yang menyala tetapi tidak menjawab (dilewati, fail-open)
          examples:
          - []
        skipped_reason:
          anyOf:
          - type: string
          - type: 'null'
          title: Skipped Reason
          description: Kenapa tidak ada putusan
        document:
          anyOf:
          - $ref: '#/components/schemas/GuardrailsDocument'
          - type: 'null'
      additionalProperties: true
      type: object
      title: GuardrailsPayload
      description: Laporan gabungan ketiga guardrail (guardrail-blank, guardrail-blur, guardrail-identity),
        dihasilkan tahap OCR karena modelnya membaca teks OCR, lalu diteruskan tanpa diubah ke structuring
        dan scoring.
    ScoringStageCallback:
      properties:
        request_id:
          type: string
          title: Request Id
          description: request_id yang Anda kirim lewat `POST /v1/ekstraksi/jobs`
          examples:
          - REQ_9cb01af2-493d-446d-b191-af120333f6d0
        stage:
          type: string
          const: SCORING
          title: Stage
          description: 'Selalu `SCORING`: tahap terakhir'
          default: SCORING
          examples:
          - SCORING
        status:
          type: string
          enum:
          - DONE
          - FAILED
          title: Status
          description: Hasil tahap ini. `FAILED` di tahap mana pun mengakhiri permintaan
          examples:
          - DONE
        result:
          anyOf:
          - $ref: '#/components/schemas/FinalResult'
          - type: 'null'
          description: Hasil akhir permintaan ketika `status` `DONE`; null ketika `FAILED`
        error_message:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Message
          description: Kenapa gagal; null bila `status` `DONE`
          examples:
          - null
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 'Hanya saat penolakan: `DOWNSTREAM_VALIDATION_ERROR` ketika dokumen ditahan guardrail
            (`error_message` memuat alasannya). Tidak ada ketika sebuah tahap rusak'
          examples:
          - null
      type: object
      required:
      - request_id
      - status
      title: ScoringStageCallback
      description: Isi callback yang dikirim sebuah tahap ke orchestrator saat selesai.
    Slip:
      properties:
        page:
          anyOf:
          - type: integer
          - type: 'null'
          title: Page
          description: Halaman asal slip ini
          examples:
          - 1
        nama_perusahaan:
          $ref: '#/components/schemas/ContractField'
          description: Nama perusahaan pemberi kerja, apa adanya termasuk bentuk badan usaha (PT, CV)
            **Wajib**.
          examples:
          - confidence: 1
            value: PT SUMBER REJEKI MAKMUR
        periode:
          $ref: '#/components/schemas/ContractField'
          description: Periode gaji, dinormalkan ke `YYYY-MM` **Wajib**.
          examples:
          - confidence: 1
            value: 2025-02
        nama_karyawan:
          $ref: '#/components/schemas/ContractField'
          description: Nama karyawan **Wajib**.
          examples:
          - confidence: 1
            value: ANDI SAPUTRA
