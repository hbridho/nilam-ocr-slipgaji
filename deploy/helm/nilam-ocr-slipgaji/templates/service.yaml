{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $component := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nilam-ocr-slipgaji.componentName" $component }}
  labels:
    {{- include "nilam-ocr-slipgaji.componentLabels" $component | nindent 4 }}
  {{- with $.Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ $.Values.service.type }}
  selector:
    {{- include "nilam-ocr-slipgaji.componentSelectorLabels" $component | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: {{ include "nilam-ocr-slipgaji.portName" $component }}
{{- end }}
{{- end }}
{{- if .Values.service.entrypoint.enabled }}
---
# Alamat yang dipublikasikan ke Orkestrasi: satu nama untuk semua service ber-entrypoint.
# Selector-nya mencakup semua pod release; tiap port hanya sampai ke pod yang punya
# port bernama itu, karena Kubernetes melewatkan pod tanpa nama port tersebut.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "nilam-ocr-slipgaji.fullname" . }}
  labels:
    {{- include "nilam-ocr-slipgaji.labels" . | nindent 4 }}
    app.kubernetes.io/component: entrypoint
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "nilam-ocr-slipgaji.selectorLabels" . | nindent 4 }}
  ports:
    {{- range $name, $svc := .Values.services }}
    {{- if and $svc.enabled $svc.entrypoint }}
    {{- $portName := include "nilam-ocr-slipgaji.portName" (dict "name" $name "svc" $svc) }}
    - name: {{ $portName }}
      port: {{ $svc.port }}
      targetPort: {{ $portName }}
    {{- end }}
    {{- end }}
{{- end }}
