{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- $component := dict "root" $ "name" $name "svc" $svc }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "nilam-ocr-slipgaji.componentName" $component }}
  labels:
    {{- include "nilam-ocr-slipgaji.componentLabels" $component | nindent 4 }}
spec:
  {{- if not (dig "autoscaling" "enabled" false $svc) }}
  replicas: {{ $svc.replicaCount | default 1 }}
  {{- end }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  selector:
    matchLabels:
      {{- include "nilam-ocr-slipgaji.componentSelectorLabels" $component | nindent 6 }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ dig "rollingUpdate" "maxSurge" 1 $svc }}
      maxUnavailable: {{ dig "rollingUpdate" "maxUnavailable" 0 $svc }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include "nilam-ocr-slipgaji.serviceEnv" (dict "root" $ "svc" $svc) | sha256sum }}
        {{- with $.Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "nilam-ocr-slipgaji.componentLabels" $component | nindent 8 }}
        {{- with $.Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "nilam-ocr-slipgaji.serviceAccountName" $ }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: {{ $svc.terminationGracePeriodSeconds | default $.Values.terminationGracePeriodSeconds }}
      {{- with $.Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml $.Values.podSecurityContext | nindent 8 }}
      containers:
        - name: {{ $name }}
          image: "{{ $.Values.image.registry }}/{{ $svc.image.repository }}:{{ include "nilam-ocr-slipgaji.imageTag" $component }}"
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            # Nama port = nama service (dipendekkan ke 15 karakter kalau perlu — batas Kubernetes),
            # supaya Service gabungan (targetPort per nama) hanya mengarah ke pod yang benar.
            - name: {{ include "nilam-ocr-slipgaji.portName" $component }}
              containerPort: {{ $svc.port }}
          envFrom:
            - configMapRef:
                name: {{ include "nilam-ocr-slipgaji.componentName" $component }}
          env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.apiKey }}
            - name: API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.apiKeys }}
                  optional: true
            {{- if or $svc.pipeline $svc.database }}
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.databaseUrl }}
            {{- end }}
            {{- if $svc.pipeline }}
            - name: ORCHESTRATION_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.orchestrationApiKey }}
                  optional: true
            - name: ORCHESTRATION_CALLBACK_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.existingSecret }}
                  key: {{ $.Values.secretKeys.callbackKey }}
                  optional: true
            {{- end }}
            - name: HOME
              value: /tmp
          # Liveness and startup check the port only: /health reports on the database, and a database blip
          # must not restart the pods.
          startupProbe:
            tcpSocket:
              port: {{ include "nilam-ocr-slipgaji.portName" $component }}
            periodSeconds: 2
            failureThreshold: {{ $svc.startupFailureThreshold }}
          livenessProbe:
            tcpSocket:
              port: {{ include "nilam-ocr-slipgaji.portName" $component }}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: {{ include "nilam-ocr-slipgaji.portName" $component }}
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                command: ["sleep", "5"]
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.containerSecurityContext | nindent 12 }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with $.Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $.Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
{{- end }}
