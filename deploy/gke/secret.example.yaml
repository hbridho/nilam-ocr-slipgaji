# Secret yang HARUS sudah ada di namespace sebelum `helm upgrade` — chart tidak membuatnya.
#
# JANGAN commit berkas ini setelah diisi, dan jangan `kubectl apply` versi berisi dari laptop:
# manifest Secret menyimpan nilainya sebagai base64, yang bukan enkripsi. Dua cara yang lebih baik
# ada di bawah.
#
# Kunci mana yang dibutuhkan siapa:
#
#   API_KEY                     semua tujuh service. Wajib.
#   API_KEYS                    opsional, untuk rotasi: beberapa kunci sah sekaligus.
#   CLOUDSQL_USER, CLOUDSQL_PASSWORD
#                               extraction, structuring, scoring: user database Cloud SQL `nilam` (dev:
#                               bribrain_user). Keduanya kosong = login IAM sebagai service account di bawah.
#   CLOUDSQL_AZURE_TENANT_ID, CLOUDSQL_AZURE_CLIENT_ID, CLOUDSQL_AZURE_CLIENT_SECRET,
#   CLOUDSQL_GCP_PROJECT_NUMBER, CLOUDSQL_GCP_POOL_ID, CLOUDSQL_GCP_PROVIDER_ID,
#   CLOUDSQL_GCP_SERVICE_ACCOUNT_EMAIL
#                               extraction, structuring, scoring: aplikasi Entra untuk Cloud SQL -> WIF ->
#                               gc-bribrain-dev-sac-sql-01 (sama dengan nilam-ocr-shm). Instance, database dan
#                               IP type ada di values (commonEnv CLOUDSQL_INSTANCE/_DATABASE/_IP_TYPE).
#                               Ketiga guardrail dan orchestrator TIDAK butuh: mereka tidak menyimpan apa pun.
#   DATABASE_URL                hanya tanpa Cloud SQL (Postgres biasa): postgresql+asyncpg://... Jangan diisi
#                               bersamaan dengan CLOUDSQL_INSTANCE: service menolak start.
#   ORCHESTRATION_API_KEY       extraction, structuring, scoring (opsional).
#   ORCHESTRATION_CALLBACK_KEY  extraction, structuring, scoring. WAJIB kalau orchestration.url
#                               diisi — tanpanya ketiganya menolak start.
#   GCS_AZURE_CLIENT_SECRET     ketiga guardrail + scoring, sebagai AZURE_CLIENT_SECRET: client secret app
#                               Entra untuk identitas GCS (wif.gcs.env). WAJIB begitu gcpWif.clientId diisi.
#   ELASTIC_APM_SECRET_TOKEN    opsional, semua service bila apm.serverUrl diisi (atau ELASTIC_APM_API_KEY).
#
# Kalau ENABLE_LLM=true DAN memakai Bedrock (bukan gateway `http`), tambahkan lima ini:
#
#   AZURE_TENANT_ID  AZURE_CLIENT_ID  AZURE_CLIENT_SECRET
#   AWS_ROLE_ARN_BRIDGE  AWS_ROLE_ARN_TARGET
#
# Catatan: ini federasi Entra ID -> STS -> Bedrock. Di GKE, Workload Identity tidak
# menggantikannya — rantainya bermula di Entra ID, bukan di Google. Yang bisa menggantikannya
# seluruhnya adalah LLM_BACKEND=http ke gateway di dalam VPC: tidak ada kredensial jangka panjang
# yang perlu disimpan sama sekali.

apiVersion: v1
kind: Secret
metadata:
  name: nilam-ocr-slipgaji-secrets
  namespace: nilam-ocr-slipgaji
type: Opaque
stringData:
  API_KEY: "GANTI"
  CLOUDSQL_USER: "GANTI"
  CLOUDSQL_PASSWORD: "GANTI"
  CLOUDSQL_AZURE_TENANT_ID: "GANTI"
  CLOUDSQL_AZURE_CLIENT_ID: "GANTI"
  CLOUDSQL_AZURE_CLIENT_SECRET: "GANTI"
  CLOUDSQL_GCP_PROJECT_NUMBER: "GANTI"
  CLOUDSQL_GCP_POOL_ID: "GANTI"
  CLOUDSQL_GCP_PROVIDER_ID: "GANTI"
  CLOUDSQL_GCP_SERVICE_ACCOUNT_EMAIL: "gc-bribrain-dev-sac-sql-01@common-sec-dev-01.iam.gserviceaccount.com"
  ORCHESTRATION_CALLBACK_KEY: "GANTI"
  # GCS_AZURE_CLIENT_SECRET: "GANTI"
  # ELASTIC_APM_SECRET_TOKEN: "GANTI"
  # API_KEYS: "kunci-lama,kunci-baru"
  # ORCHESTRATION_API_KEY: "GANTI"

---
# CARA YANG LEBIH BAIK 1 — buat langsung, tanpa berkas yang bisa tertinggal di disk:
#
#   kubectl -n nilam-ocr-slipgaji create secret generic nilam-ocr-slipgaji-secrets \
#     --from-literal=API_KEY='...' \
#     --from-literal=ORCHESTRATION_CALLBACK_KEY='...' \
#     --from-literal=CLOUDSQL_USER='...' --from-literal=CLOUDSQL_PASSWORD='...' \
#     --from-literal=CLOUDSQL_AZURE_TENANT_ID='...' --from-literal=CLOUDSQL_AZURE_CLIENT_ID='...' \
#     --from-literal=CLOUDSQL_AZURE_CLIENT_SECRET='...' \
#     --from-literal=CLOUDSQL_GCP_PROJECT_NUMBER='...' --from-literal=CLOUDSQL_GCP_POOL_ID='...' \
#     --from-literal=CLOUDSQL_GCP_PROVIDER_ID='...' --from-literal=CLOUDSQL_GCP_SERVICE_ACCOUNT_EMAIL='...'
#
# Tanda petik tunggal di shell: password dengan `!` atau `$` tidak diubah oleh shell.
#
# CARA YANG LEBIH BAIK 2 — Secret Manager, supaya tidak ada rahasia di tangan manusia:
# chart punya template ExternalSecret (externalSecret.enabled: true) yang menarik nilainya dari
# Google Secret Manager lewat External Secrets Operator. Isi `externalSecret.secretStoreRef` dan
# `externalSecret.remoteKeys`, lalu operator yang membuat Secret di atas. Ini yang dipakai kalau
# cluster sudah punya ESO.
