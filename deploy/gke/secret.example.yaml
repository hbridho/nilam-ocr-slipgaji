# Secret yang HARUS sudah ada di namespace sebelum `helm upgrade` — chart tidak membuatnya.
#
# JANGAN commit berkas ini setelah diisi, dan jangan `kubectl apply` versi berisi dari laptop:
# manifest Secret menyimpan nilainya sebagai base64, yang bukan enkripsi. Dua cara yang lebih baik
# ada di bawah.
#
# Kunci mana yang dibutuhkan siapa:
#
#   API_KEY                     semua tujuh service. Wajib.
#   API_KEYS                    opsional, untuk rotasi: beberapa kunci sah sekaligus.
#   DATABASE_URL                extraction, structuring, scoring (orchestrator tidak punya DB).
#                               Ketiga guardrail TIDAK butuh — mereka tidak menyimpan apa pun.
#                               Format SQLAlchemy: postgresql+asyncpg://... (BUKAN JDBC).
#   ORCHESTRATION_API_KEY       extraction, structuring, scoring (opsional).
#   ORCHESTRATION_CALLBACK_KEY  extraction, structuring, scoring. WAJIB kalau orchestration.url
#                               diisi — tanpanya ketiganya menolak start.
#
# Kalau ENABLE_LLM=true DAN memakai Bedrock (bukan gateway `http`), tambahkan lima ini:
#
#   AZURE_TENANT_ID  AZURE_CLIENT_ID  AZURE_CLIENT_SECRET
#   AWS_ROLE_ARN_BRIDGE  AWS_ROLE_ARN_TARGET
#
# Catatan: ini federasi Entra ID -> STS -> Bedrock. Di GKE, Workload Identity tidak
# menggantikannya — rantainya bermula di Entra ID, bukan di Google. Yang bisa menggantikannya
# seluruhnya adalah LLM_BACKEND=http ke gateway di dalam VPC: tidak ada kredensial jangka panjang
# yang perlu disimpan sama sekali.

apiVersion: v1
kind: Secret
metadata:
  name: nilam-ocr-slipgaji-secrets
  namespace: nilam-ocr-slipgaji
type: Opaque
stringData:
  API_KEY: "GANTI"
  DATABASE_URL: "postgresql+asyncpg://USER:PASSWORD@HOST:5432/bribrain_ocr_nilam"
  ORCHESTRATION_CALLBACK_KEY: "GANTI"
  # API_KEYS: "kunci-lama,kunci-baru"
  # ORCHESTRATION_API_KEY: "GANTI"

---
# CARA YANG LEBIH BAIK 1 — buat langsung, tanpa berkas yang bisa tertinggal di disk:
#
#   kubectl -n nilam-ocr-slipgaji create secret generic nilam-ocr-slipgaji-secrets \
#     --from-literal=API_KEY='...' \
#     --from-literal=DATABASE_URL='postgresql+asyncpg://...' \
#     --from-literal=ORCHESTRATION_CALLBACK_KEY='...'
#
# Kata sandi dengan karakter khusus harus di-percent-encode di DATABASE_URL (@ -> %40, : -> %3A),
# kalau tidak URL-nya terbaca salah dan galatnya menyesatkan.
#
# CARA YANG LEBIH BAIK 2 — Secret Manager, supaya tidak ada rahasia di tangan manusia:
# chart punya template ExternalSecret (externalSecret.enabled: true) yang menarik nilainya dari
# Google Secret Manager lewat External Secrets Operator. Isi `externalSecret.secretStoreRef` dan
# `externalSecret.remoteKeys`, lalu operator yang membuat Secret di atas. Ini yang dipakai kalau
# cluster sudah punya ESO.
